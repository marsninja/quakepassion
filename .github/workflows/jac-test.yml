name: jac test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request supersedes its running check; main keeps
# every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JAC_CACHE_HOME: ${{ github.workspace }}/../jac-cache
    steps:
      - name: Checkout (with pinned compiler source)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The released binary compiles with the jaseci submodule's pinned
      # compiler source, which carries upstream fixes not yet released.
      - name: Install Jac binary
        run: |
          mkdir -p "$HOME/.local/bin"
          asset=jac-0.37.23-linux-x86_64
          release=https://github.com/jaseci-labs/jac/releases/download/v0.37.23
          curl -fsSL "$release/$asset" -o "$RUNNER_TEMP/$asset"
          curl -fsSL "$release/$asset.sha256" -o "$RUNNER_TEMP/$asset.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c "$asset.sha256")
          install -m 755 "$RUNNER_TEMP/$asset" "$HOME/.local/bin/jac"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Stage pinned compiler source
        id: pin
        run: |
          bash scripts/stage_compiler.sh >> "$GITHUB_ENV"
          echo "sha=$(git rev-parse HEAD:jaseci)" >> "$GITHUB_OUTPUT"

      # The pinned source compiles into a native compiler kernel on first use
      # (about 45 minutes and 13 GB at peak); later runs reuse it, and the
      # tests then run several times faster and leaner than with the
      # compiler interpreted.
      - name: Restore the compiler kernel and module cache
        id: jaccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.JAC_CACHE_HOME }}
          key: jac-${{ runner.os }}-${{ steps.pin.outputs.sha }}

      - name: Add swap for the kernel build
        if: steps.jaccache.outputs.cache-hit != 'true'
        run: |
          sudo fallocate -l 8G /extra-swap
          sudo chmod 600 /extra-swap
          sudo mkswap /extra-swap
          sudo swapon /extra-swap

      - name: Show compiler version
        run: jac --version

      - name: Install raylib build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential xorg-dev libgl1-mesa-dev

      - name: Build raylib with JPG and TGA support
        run: bash scripts/stage_raylib.sh

      - name: Verify native visit regression
        run: |
          jac build repros/native_visit_list.jac --native -o /tmp/qp-visit-repro
          /tmp/qp-visit-repro

      - name: Verify native asset operations
        run: |
          jac build repros/native_quake_asset_ops.jac --native -o /tmp/qp-assets-repro
          /tmp/qp-assets-repro

      - name: Verify native iterable regression
        run: |
          jac build scripts/repros/native_sorted_set.jac --native -o /tmp/qp-sorted-repro
          /tmp/qp-sorted-repro

      - name: Build native viewer
        run: jac build main.jac --native -o qp

      - name: Save the compiler kernel and module cache
        if: steps.jaccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.JAC_CACHE_HOME }}
          key: jac-${{ runner.os }}-${{ steps.pin.outputs.sha }}

      # One process per test file: a single run over the whole suite grows
      # past the runner's memory. Each file runs cold, then again warm.
      - name: Run jac test
        timeout-minutes: 240
        run: |
          ls tests/*_tests.jac | xargs -P 3 -I{} sh -c 'jac test {} > "/tmp/$(basename {}).log" 2>&1 || { echo "FAILED {}"; tail -40 "/tmp/$(basename {}).log"; exit 1; }'
          ls tests/*_tests.jac | xargs -P 3 -I{} sh -c 'jac test {} > "/tmp/$(basename {}).warm.log" 2>&1 || { echo "FAILED (warm) {}"; tail -40 "/tmp/$(basename {}).warm.log"; exit 1; }'
