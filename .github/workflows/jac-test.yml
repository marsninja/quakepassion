name: jac test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JAC_COMPILER_LIB: "off"
    steps:
      - name: Checkout (with reference compiler source)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout pinned compiler source
        uses: actions/checkout@v4
        with:
          repository: jaseci-labs/jac
          ref: fb6940ddd52a76ea75790dda10736ef09926f0fd
          path: .jac/upstream

      # Keep the launcher and source revision aligned with README setup.
      - name: Install Jac binary
        run: |
          mkdir -p "$HOME/.local/bin"
          asset=jac-0.37.19-linux-x86_64
          release=https://github.com/jaseci-labs/jac/releases/download/v0.37.19
          curl -fsSL "$release/$asset" -o "$RUNNER_TEMP/$asset"
          curl -fsSL "$release/$asset.sha256" -o "$RUNNER_TEMP/$asset.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c "$asset.sha256")
          install -m 755 "$RUNNER_TEMP/$asset" "$HOME/.local/bin/jac"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show compiler version
        run: jac --version

      - name: Stage compiler with upstream fixes
        run: |
          python3 scripts/prepare_compiler.py --source .jac/upstream \
            --patch patches/jac-native-bytearray-extend.patch \
            --patch patches/jac-native-aggregate-bytes.patch \
            --patch patches/jac-native-sorted-iterable.patch \
            --patch patches/jac-native-scalar-return.patch

      - name: Install raylib build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential xorg-dev libgl1-mesa-dev

      - name: Build raylib with JPG and TGA support
        run: bash scripts/stage_raylib.sh

      - name: Verify native visit regression
        run: |
          jac build repros/native_visit_list.jac --native -o /tmp/qp-visit-repro
          /tmp/qp-visit-repro

      - name: Verify native asset operations
        run: |
          jac build repros/native_quake_asset_ops.jac --native -o /tmp/qp-assets-repro
          /tmp/qp-assets-repro

      - name: Verify native iterable regression
        run: |
          jac build scripts/repros/native_sorted_set.jac --native -o /tmp/qp-sorted-repro
          /tmp/qp-sorted-repro

      - name: Build native viewer
        run: jac build main.jac --native -o qp

      # Discovery is anchored to the project root via jac.toml ([test] directory).
      - name: Run jac test
        run: jac test -j0
