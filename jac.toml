[project]
name = "quakepassion"
version = "0.1.0"
description = "A heartfelt 3D engine in pure Jac and raylib that plays all three Quakes"
entry-point = "main"

[dependencies]
raylib = ">=5.5"

[test]
directory = "tests"

# Private compiler sources with native ZIP, bytearray, and aggregate C-call fixes.
# See README.md for prepare_compiler.py --source and required upstream patches.
[dev]
jaclang_source = ".jac/compiler"
