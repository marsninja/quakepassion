[project]
name = "quakepassion"
version = "0.1.0"
description = "A heartfelt 3D engine in pure Jac and raylib that plays all three Quakes"
entry-point = "main"

[dependencies]
raylib = ">=5.5"

[test]
directory = "tests"

# Local copy of the installed compiler with native OSP visit and asset-operation fixes.
# Materialize with: python3 scripts/prepare_compiler.py
[dev]
jaclang_source = ".jac/compiler"
