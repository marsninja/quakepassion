// Terrain made, sculpted by command and by dragging the brush over it, and
// its heights written and read as an image (scripts/validate_studio.jac).
edit
ui_idle 3
ui_sync
ed_scene hills
ui_idle 3
ui_sync
ed_cam 0 -520 420 90 -40
ed_terrain 8 8 64
ui_idle 4
ui_sync
ed_dump made

// A stroke where the camera looks, by command.
ed_sculpt raise 160 96
ui_idle 4
ui_sync
ed_dump raised
ed_terrain export .jac/studio-pack/hills.pgm

// Sculpt mode (4): drag the brush across the terrain, then lower with Shift.
ui_click 700 600 1
ui_key 4
ui_idle 3
ui_sync
ui_drag 520 300 720 300 0 18
ui_idle 5
ui_sync
ed_dump stroked
screenshot terrain_hills
ui_mod shift 1
ui_click 620 300
ui_mod shift 0
ui_idle 5
ui_sync
ed_dump lowered

// Flattened, then given back the heights that were written out.
ed_sculpt flatten 2000 0
ui_idle 4
ui_sync
ed_dump flat
ed_terrain import .jac/studio-pack/hills.pgm 96
ui_idle 4
ui_sync
ed_dump read

// Save, play it, come back.
ed_save
ed_play
wait
wait
wait
wait
screenshot terrain_playing
edit
ui_idle 3
ui_sync
ed_dump returned
quit
