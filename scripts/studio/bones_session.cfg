// A model's bones: two up a column, jointed; every point given to the bone
// nearest it, and a ring shared between the two; the forearm turned by
// command and by dragging its end round its joint; the frames between two
// poses spread; the bones kept beside the model's file and read back with it
// (scripts/validate_studio.jac runs this, and names the folder in QP_MODELS).
edit
ui_idle 3
ui_sync
ed_model new cylinder 64 64 96 8
ui_idle 6
ui_sync
ed_dump made

// A bone up the lower half, another carrying on to the top; each point to
// the bone it is nearest.
ed_bone add upper 0 0 0 0 0 48
ed_bone chain fore 0 0 96
ed_bone auto
ui_idle 3
ui_sync
ed_dump rigged

// Two points of the top ring shared: half to the lower bone leaves half
// with the upper one.
ed_pick points 8 9
ed_bone pick upper
ed_bone hold 0.5
ed_bone weights
ed_bone colours on
ui_idle 4
ui_sync
ed_dump shared
screenshot bones_shared
ed_bone release
ed_bone weights
ed_dump freed
ed_bone pick fore
ed_bone hold
ed_pick none

// The forearm turned thirty degrees about x; and that undone.
ed_bone turn x 30
ui_idle 4
ui_sync
ed_dump turned
ed_model undo
ui_idle 3
ui_sync
ed_dump undone

// Its end taken a quarter of the way round its joint, as seen.
ui_drag 785 281 872 368
ui_idle 4
ui_sync
ed_dump dragged
screenshot bones_dragged
ed_model undo
ui_idle 3
ui_sync

// Two more frames; bent at the last, and the one between set half way.
ed_model frame copy mid
ed_model frame copy bent
ed_bone turn x 60
ed_bone spread 0 2
ed_frame 1
ui_idle 4
ui_sync
ed_dump spread
ed_frame 0
ed_dump rest

// Saved, closed and opened again: the bones come back with the model.
ed_model save arm.md3
ed_model close
ed_dump closed
ed_model open arm.md3
ui_idle 4
ui_sync
ed_frame 2
ed_dump reopened

// The lower bone taken away: the other hangs from nothing.
ed_bone drop upper
ed_bone turn q 10
ed_bone pick wrist
ed_dump dropped
quit
