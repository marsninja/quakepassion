// Build presets, a game played from the studio held still and stepped tick
// by tick, and only the selection played
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene play
ui_idle 3
ui_sync
ed_grid 16
ed_box 64 64 64
ed_new light
ui_idle 6
ui_sync
ed_dump boxed

// How the level is lit: coarsely, finely, not at all.
ed_build quick
ui_idle 6
ui_sync
ed_dump quick
ed_build full
ui_idle 6
ui_sync
ed_dump full
ed_build flat
ui_idle 6
ui_sync
ed_dump flat
ed_build full
ui_idle 6
ui_sync

