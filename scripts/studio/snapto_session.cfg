// A loop drawn round what is to be selected, and moves that end on a
// corner, an edge or a face of another brush
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene tiles
ui_idle 3
ui_sync
ed_grid 16
ed_cam 0 -420 260 90 -24
ed_import scripts/studio/fixtures/tiles.map
ui_idle 5
ui_sync
ed_select
ed_layout 4
ui_idle 4
ui_sync
ed_dump brought

// In the top view, Alt and a drag round the three tiles that stand
// together: a loop, not a rectangle, so the lower box beside them is left.
ui_mod alt 1
ui_press 728 160
ui_move 765 160
ui_move 790 150
ui_move 790 138
ui_move 770 138
ui_move 770 146
ui_move 728 146
ui_release 728 146
ui_mod alt 0
ui_idle 4
ui_sync
ed_dump looped
screenshot snapto_looped
// The same by command, and one more loop added to it.
ed_select
ed_lasso 1 728 160 765 160 790 150 790 138 770 138 770 146 728 146
ed_dump again

// The far tile moved toward the nearest: as asked, it stops seven short;
// with corners in reach it ends corner to corner.
ed_select solid:6
ed_move -121 30 0
ui_idle 3
ui_sync
ed_dump asked
ed_undo
ed_snapto corners 8
ed_move -121 30 0
ui_idle 3
ui_sync
ed_dump cornered
ed_undo
// Along an edge, where no corner is in reach; and against a face.
ed_move -121 45 0
ui_idle 3
ui_sync
ed_dump no_corner
ed_undo
ed_snapto edges
ed_move -121 45 0
ui_idle 3
ui_sync
ed_dump edged
ed_undo
ed_snapto faces
ed_move -121 45 10
ui_idle 3
ui_sync
ed_dump faced
ed_undo
ed_snapto grid
ed_snapto sideways
ed_dump plain
quit
