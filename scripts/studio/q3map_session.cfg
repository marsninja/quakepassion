// A scene written as a map in Quake III's own form (a matrix a side,
// patches as patches) and opened again with its materials where they lay
// (scripts/validate_studio.jac runs this, and reads what is written under
// .jac/studio-q3map).
edit
ui_idle 3
ui_sync
ed_scene bend
ui_idle 3
ui_sync
ed_grid 16
ed_cam 0 -420 260 90 -24

// A box in one of Quake III's textures (256 by 512), its top slid and
// turned; and a curved sheet with its material placed a point at a time.
ed_box 128 64 64
ed_material q3:textures/base_wall/archpipe2_k_tall3fin
ed_face 3 4
ed_tex shift 8 4
ed_tex turn 30
ed_tex scale 0.5 0.25
ed_texhandles on
ui_idle 4
ui_sync
ed_dump made
ed_select
ed_patch sheet 128 128 64
ed_patch uv fit 2 1
ed_patch uv point 0 0 -16 -8
ed_patch uv
ui_idle 4
ui_sync
ed_dump bent

// Written three ways.
ed_export .jac/studio-q3map/bend_q3.map q3
ed_export .jac/studio-q3map/bend_valve.map
ed_export .jac/studio-q3map/bend_classic.map classic
ed_export .jac/studio-q3map/bend.txt q3
ed_export .jac/studio-q3map/bend_other.map doom

// Quake III's opened again: the texture found among the game's by the
// name the file has for it, the top's material where it lay, and the
// sheet a patch still, with its places.
ed_open .jac/studio-q3map/bend_q3.map
ui_idle 5
ui_sync
ed_face 2 4
ui_idle 3
ui_sync
ed_dump opened
ed_select class:func_group
ed_patch uv
ui_idle 3
ui_sync
ed_dump patched
quit
