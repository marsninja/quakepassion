// Linked prefabs turned and sized where they stand: a bench kept as a
// prefab, an instance turned a quarter round, made twice as large, and
// turned into plain brushes to see where they lie; a size of nothing
// refused; the instance put back as its file has it; and tipped nose
// down
// (scripts/validate_studio.jac runs this, and names the folder in
// QP_PREFABS).
edit
ui_idle 3
ui_sync
ed_scene turning
ui_idle 3
ui_sync
ed_grid 16
ed_cam 0 -420 260 90 -24

// A bench 96 long, 32 deep and 16 high, kept as a prefab and taken out.
ed_box 96 32 16
ui_idle 3
ui_sync
ed_prefab save bench
ed_delete

// One linked in as its file has it, and as plain brushes to see where.
ed_prefab link bench
ed_set origin "0 128 0"
ui_idle 6
ui_sync
ed_dump linked
ed_prefab unlink
ui_idle 4
ui_sync
ed_dump plain
ed_undo
ed_undo

// Turned a quarter round where it stands: long along y.
ed_select class:misc_prefab
ed_prefab turn 60
ed_prefab turn 30
ui_idle 6
ui_sync
ed_dump turned
ed_prefab unlink
ui_idle 4
ui_sync
ed_dump turned_plain
ed_undo
ed_undo

// Twice as large as well, about where it stands.
ed_select class:misc_prefab
ed_prefab scale 2
ed_prefab scale 0
ed_prefab scale big
ui_idle 6
ui_sync
ed_dump sized
screenshot turned_bench
ed_prefab unlink
ui_idle 4
ui_sync
ed_dump sized_plain
ed_undo
ed_undo

// Longer only: the size is given before the turn, so it is the bench's
// own length that is doubled.
ed_select class:misc_prefab
ed_prefab scale 2 1 1
ui_idle 6
ui_sync
ed_dump long
ed_prefab unlink
ui_idle 4
ui_sync
ed_dump long_plain
ed_undo
ed_undo

// As its file has it again.
ed_select class:misc_prefab
ed_prefab plain
ui_idle 6
ui_sync
ed_dump again

// Tipped nose down a quarter: its length hangs through the floor from
// where it stands. A way to turn that is none is refused.
ed_prefab turn 90 pitch
ed_prefab turn 5 sideways
ui_idle 6
ui_sync
ed_dump tipped
ed_prefab unlink
ui_idle 4
ui_sync
ed_dump tipped_plain
ed_undo
ed_undo
ed_select class:misc_prefab
ed_prefab plain
ui_idle 6
ui_sync
ed_dump level
quit
