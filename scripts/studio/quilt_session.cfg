// A curved sheet given more curves across and up, one taken away again,
// made thicker and finer; and an endcap
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene quilt
ui_idle 3
ui_sync
ed_cam 0 -520 300 90 -28
ed_patch sheet 128 128 64
ui_idle 4
ui_sync
ed_dump made

// Another curve across it, then another up it.
ed_patch grow u
ui_idle 4
ui_sync
ed_dump wider
ed_patch grow v
ui_idle 4
ui_sync
ed_dump taller
screenshot quilt_grown

// One taken away again; then thicker, then finer.
ed_patch shrink u
ui_idle 4
ui_sync
ed_dump narrower
ed_patch thick 24
ed_patch fine 8
ui_idle 4
ui_sync
ed_dump fine

// Half a pipe standing upright.
ed_patch endcap 128 64 96
ui_idle 4
ui_sync
ed_dump endcap
screenshot quilt_endcap
ed_save
quit
