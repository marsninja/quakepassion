// Curved patches made, bent by command and by dragging a control point, and
// moved (scripts/validate_studio.jac). The window is the default 1280 by 720.
edit
ui_idle 3
ui_sync
ed_scene curves
ui_idle 3
ui_sync
ed_cam 0 -420 260 90 -24
ed_patch arch 128 64 96
ui_idle 4
ui_sync
ed_dump made

// One control point of its crown lifted, by command.
ed_patch_point 3 2 0 0 32
ui_idle 4
ui_sync
ed_dump bent

// Corners (3) shows the control points; drag one sideways in the front view.
ed_focus
ui_click 700 600 1
ui_key 3
ed_layout 4
ed_display wire axis
ui_idle 4
ui_sync
ui_drag 526 499 564 499
ui_idle 4
ui_sync
ed_dump dragged
screenshot patch_arch
ed_layout 1
ed_display textured axis
ui_key 1
ui_idle 3
ui_sync

// Moved as a whole, its control points go with it.
ed_move 64 0 0
ui_idle 4
ui_sync
ed_dump moved

// A cylinder and a cone beside it.
ed_cam 220 -420 260 90 -24
ed_patch cylinder 96 96 128
ui_idle 4
ui_sync
ed_dump tube
ed_cam -220 -420 260 90 -24
ed_patch cone 96 96 128
ui_idle 4
ui_sync
ed_dump cone

// Save, play it, come back.
ed_save
ed_cam 0 -520 300 90 -28
ed_play
wait
wait
wait
wait
screenshot patch_playing
edit
ui_idle 3
ui_sync
ed_dump returned
quit
