// Several documents open at once, saved together, closed and found again
// among the recent files; maps written without comments and in whole
// numbers; the selection's menu on a right click; a brush's faces stepped
// through (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene one
ui_idle 3
ui_sync
ed_box 64 64 64
ed_cam 100 100 300 0 -20
ui_idle 3
ui_sync
ed_scene two
ui_idle 3
ui_sync
ed_box 32 32 32
ui_idle 3
ui_sync
ed_docs
ed_dump two

// Back to the first: its camera is where it was left.
ed_doc one
ui_idle 4
ui_sync
ed_dump one
ed_doc next
ui_idle 4
ui_sync
ed_dump next

// Both saved at once; the second closed; the files are in the recent list.
ed_save all
ed_doc studio:two
ui_idle 4
ui_sync
ed_close
ui_idle 4
ui_sync
ed_docs
ed_dump closed
ed_recent
ui_idle 2
ui_sync
ui_key ESCAPE
ui_idle 2
ui_sync
ed_recent 1
ui_idle 4
ui_sync
ed_dump reopened
ed_log 5
ui_idle 2
ui_sync
screenshot docs_log
ui_key ESCAPE
ui_idle 2
ui_sync

// A box drawn in the plan; a right click on it opens its menu, and
// Duplicate is the second line.
ed_doc one
ed_layout 4
ed_grid 16
ui_idle 4
ui_sync
ed_select
ui_click 788 300 1
ui_key 6
ui_idle 2
ui_sync
ui_drag 700 150 760 180
ui_idle 4
ui_sync
ui_key 1
ui_idle 3
ui_sync
ed_dump drawn
ui_click 729 164 1
ui_idle 3
ui_sync
screenshot docs_menu
ui_click 769 201
ui_idle 4
ui_sync
ed_dump duplicated

// Faces (2): the top picked, then the next face and the one before.
ed_undo
ui_key 2
ui_idle 2
ui_sync
ui_click 729 164
ui_idle 3
ui_sync
ed_dump face
ed_faces next
ui_idle 2
ui_sync
ed_dump stepped
ed_faces prev
ui_idle 2
ui_sync
ed_dump stepped_back
ui_key 1

// Written without the numbered comments, in whole numbers.
ed_mapopts comments off
ed_mapopts whole on
ed_save
quit
