// Floating 3D windows: a second view of the level in a window of its own,
// moved by its bar and sized by its corner, with a camera of its own that
// the wheel and a click work through; a third, in outlines, over it, closed
// by its cross; Escape still letting go of the selection; and a window kept
// within the views (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene floats
ui_idle 3
ui_sync
ed_cam 0 -420 260 90 -24
ed_box 64 64 64
ui_idle 3
ui_sync
ed_window
ed_dump none

// A window of its own, put somewhere and looking from elsewhere.
ed_window new
ui_idle 4
ui_sync
ed_window 2 at 600 300 340 240
ed_window 2 cam 300 -300 200 135 -20
ui_idle 4
ui_sync
ed_dump opened
screenshot float_one

// Dragged by its bar; sized by its corner.
ui_drag 700 310 500 160
ui_idle 3
ui_sync
ed_dump moved
ui_drag 733 383 793 423
ui_idle 3
ui_sync
ed_dump sized

// The wheel over it moves its camera, not the first view's.
ui_move 600 300
ui_wheel 1
ui_idle 3
ui_sync
ed_dump dollied

// Looking straight at the box from its side, a click in the window picks it.
ed_window 2 cam -150 160 32 0 0
ed_select
ui_idle 4
ui_sync
ui_click 600 293
ui_idle 3
ui_sync
ed_dump picked

// Escape lets go of the selection, and the window stays.
ui_key ESCAPE
ui_idle 3
ui_sync
ed_dump escaped

// Another, in outlines, over the first; closed by its cross.
ed_window new outlines
ui_idle 4
ui_sync
ed_window 3 at 560 260 300 220
ui_idle 4
ui_sync
ed_dump two
screenshot float_two
ui_click 850 270
ui_idle 4
ui_sync
ed_dump closed

// Sent off the edge, it stays within the views; then all are closed.
ed_window 2 at 5000 5000
ed_window 2 outlines
ed_window 9 outlines
ui_idle 3
ui_sync
ed_dump kept
ed_window close all
ui_idle 3
ui_sync
ed_window
ed_dump gone
quit
