// Sounds and texture sets: a WAV from elsewhere made what a game plays, a
// Quake II texture's flags changed in a copy among the project's textures,
// and the frames of animated textures listed
// (scripts/validate_studio.jac runs this; it writes the sound and the
// texture, and names their folders in QP_SOUNDS and QP_TEXTURES).
edit
ui_idle 3
ui_sync
ed_dump begin
ed_sound info scripts/studio/fixtures/blip.wav
ed_sound convert scripts/studio/fixtures/blip.wav blip
ed_sound convert scripts/studio/fixtures/blip.wav quiet 11025 8 loud

// A wall texture's own facts, read from a file; then changed.
ed_dump wal
ed_wal scripts/studio/fixtures/plate.wal
ed_wal scripts/studio/fixtures/plate.wal flag light on flag warp on value 300 next lab/plate2
ed_dump frames
ed_frames q1:e1m1/+0slip
ed_frames nothing_animated
quit
