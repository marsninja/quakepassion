// Shapes, light, the class list and the typed inspector, driven as a hand
// would drive them (scripts/validate_studio.jac). The window is the default
// 1280 by 720.
edit
ui_idle 3
ui_sync
ed_scene hall
ui_idle 3
ui_sync

// Stairs, an arch and a cone where the camera looks.
ed_cam 0 -420 260 90 -24
ed_shape stairs 64 128 64 8
ui_idle 3
ui_sync
ed_dump stairs
ed_cam 180 -420 260 90 -24
ed_shape arch
ui_idle 3
ui_sync
ed_dump arch
ed_cam -180 -420 260 90 -24
ed_shape cone 64 64 96
ui_idle 3
ui_sync
ed_dump cone

// A light: the level is lit from it, flat again when asked, and lit again.
ed_cam 0 -300 200 90 -30
ed_new light
ed_set light 400
ui_idle 4
ui_sync
ed_dump lit
ed_light off
ui_idle 4
ui_sync
ed_dump flat
ed_light on
ui_idle 4
ui_sync
ed_dump relit
ed_cam 0 -520 300 90 -28
ui_key ESCAPE
ui_idle 3
ui_sync
screenshot build_lit

// The Classes tab: open the func family and click func_door. With nothing
// selected it is made of a new box.
ui_click 260 67
ui_idle 3
ui_sync
ui_click 60 159
ui_idle 3
ui_sync
ui_click 80 240
ui_idle 4
ui_sync
ed_dump door

// Its options are boxes to tick: start open, then gold key.
ui_click 975 255
ui_idle 3
ui_sync
ed_dump flagged
ui_click 975 308
ui_idle 3
ui_sync
ed_dump keyed

// Its sounds are a list: open it and choose stone.
ui_click 1171 552
ui_idle 3
ui_sync
ui_click 1171 601
ui_idle 3
ui_sync
ed_dump sounded

// An angle typed into a field the door did not have yet, then turned by its button.
ui_click 1171 423
ui_type 90
ui_key ENTER
ui_idle 3
ui_sync
ed_dump angled
ui_click 1210 208
ui_idle 3
ui_sync
ed_dump turned
screenshot build_inspector

// A button aimed at the door: the arrow beside its target selects the door.
ed_set targetname gate
ed_new func_button
ed_set target gate
ui_idle 3
ui_sync
ed_dump aimed
ui_click 1237 180
ui_idle 3
ui_sync
ed_dump followed

// Save, play it, come back.
ed_save
ed_dump saved
ed_play
wait
wait
wait
wait
wait
wait
screenshot build_playing
edit
ui_idle 3
ui_sync
ed_dump returned
quit
