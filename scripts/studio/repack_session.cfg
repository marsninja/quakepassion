// Archives opened up and changed: Quake's gfx.wad as a folder of its
// lumps in the explorer, one shown as the picture it is and written out;
// and a PAK and a PK3 made a file at a time, one file put in place of
// another, a folder dropped, and what they hold listed
// (scripts/validate_studio.jac runs this, with the files to pack under
// .jac/studio-repack/seed).
edit
ui_idle 3
ui_sync
ed_layout assets
ui_idle 4
ui_sync

// The status bar's picture, a lump of Quake's gfx.wad.
ed_asset dir:q1:gfx.wad
ed_asset file:q1:gfx.wad/sbar
ui_idle 5
ui_sync
ed_dump lump
screenshot repack_lump
ed_extract
// The console's letters: a sheet with no size written before it.
ed_asset file:q1:gfx.wad/conchars
ui_idle 5
ui_sync
ed_dump letters

// A PAK made a file at a time, each under the name it is given.
ed_pack add .jac/studio-repack/yard.pak .jac/studio-repack/seed/note.txt
ed_pack add .jac/studio-repack/yard.pak .jac/studio-repack/seed/wall.txt textures/yard/wall.txt
ed_pack add .jac/studio-repack/yard.pak .jac/studio-repack/seed/floor.txt textures/yard/floor.txt
ed_pack list .jac/studio-repack/yard.pak
ed_dump made
// One put in place of another (whatever the case of its name), a folder
// dropped, and nothing dropped that is not there.
ed_pack add .jac/studio-repack/yard.pak .jac/studio-repack/seed/wall.txt NOTE.TXT
ed_pack drop .jac/studio-repack/yard.pak textures/
ed_pack drop .jac/studio-repack/yard.pak nothing.txt
ed_pack add .jac/studio-repack/yard.pak .jac/studio-repack/seed/missing.txt
ed_pack list .jac/studio-repack/yard.pak
ed_dump changed

// The same of a PK3.
ed_pack add .jac/studio-repack/yard.pk3 .jac/studio-repack/seed/note.txt scripts/note.txt
ed_pack add .jac/studio-repack/yard.pk3 .jac/studio-repack/seed/wall.txt textures/yard/wall.txt
ed_pack add .jac/studio-repack/yard.pk3 .jac/studio-repack/seed/floor.txt scripts/note.txt
ed_pack drop .jac/studio-repack/yard.pk3 textures/yard/wall.txt
ed_pack list .jac/studio-repack/yard.pk3
ed_pack list .jac/studio-repack/none.pak
ed_pack list .jac/studio-repack/seed/note.txt
ed_dump zipped

// A game's own archives are left alone (the run reads Quake from a copy
// of its PAKs under .jac/studio-repack/id1, and these are that copy's).
ed_pack add .jac/studio-repack/id1/pak0.pak .jac/studio-repack/seed/note.txt
ed_pack drop .jac/studio-repack/id1/pak0.pak gfx.wad
ed_pack list .jac/studio-repack/id1/pak0.pak
ed_dump kept
quit
