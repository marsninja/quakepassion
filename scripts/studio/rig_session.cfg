// The model editor by hand: a triangle and then a point picked by clicks
// in the view, the picked point dragged with Ctrl, tags added and moved a
// frame at a time, a frame moved in the order, and a part's skins
// (scripts/validate_studio.jac runs this, and names the folder in QP_MODELS).
edit
ui_idle 3
ui_sync
ed_model new cylinder 64 64 96 8
ui_idle 6
ui_sync
ed_orbit 0 -80 300
ui_idle 3
ui_sync
ed_dump made

// A click on the top picks the triangle there; a click with Shift across
// the middle adds another.
ui_click 797 388
ui_sync
ed_dump faceclick
ui_mod shift 1
ui_click 777 372
ui_mod shift 0
ui_sync
ed_dump added
screenshot rig_faces

// Clicks pick points now: the middle of the top. With Ctrl it is dragged
// up the view, and the drag undone.
ed_pick mode points
ui_click 787 381
ui_sync
ed_dump pointclick
ui_mod ctrl 1
ui_drag 787 381 787 341
ui_mod ctrl 0
ui_sync
ed_dump dragged
ed_model undo
ed_dump undragged

// Tags: one where it is told, one in the middle of what is picked; moved
// at every frame, and at one after a frame is copied.
ed_model tag add tag_top 0 0 96
ed_model tag add tag_side
ed_model tag at tag_side 32 0 48 all
ed_model frame copy up
ed_model tag at tag_top 0 0 128
ed_dump tagged
ed_model tag
ed_frame 0
ed_dump first
ed_model tag

// The copied frame moved to the front; a tag dropped; skins named and one dropped.
ed_frame 1
ed_model frame move 0
ed_dump moved
ed_model tag drop tag_side
ed_model skin add models/tower/skin.tga
ed_model skin add models/tower/alt.tga
ed_model skin drop 0
ed_dump skinned
ed_model skin
ed_model save rig.md3
ui_idle 4
ui_sync
screenshot rig_tags
quit
