// The model editor's list of frames: shown, a frame gone to by a click on
// its row, a frame dragged to another place in the order, the frame in
// hand named, copied and dropped from the panel; and a point and a
// triangle found by number (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_layout assets
ui_idle 3
ui_sync
ed_model new cylinder 64 64 96 8
ed_model frame copy raised
ed_mesh move 0 0 16
ed_model frame copy high
ed_mesh move 0 0 16
ed_model frame copy top
ed_mesh move 0 0 16
ed_frame 0
ui_idle 4
ui_sync
ed_dump made

// The list, and a click on its third row.
ed_model frames on
ui_idle 4
ui_sync
ui_click 780 518
ui_idle 4
ui_sync
ed_dump clicked
screenshot frames_listed

// The last frame dragged onto the first row: it is first now.
ui_drag 780 538 780 478
ui_idle 4
ui_sync
ed_model frames on
ed_dump moved

// Named, copied and dropped from the panel.
ed_model frame name summit
ui_idle 4
ui_sync
ui_click 881 588
ui_idle 4
ui_sync
ed_model frames on
ed_dump copied
ui_click 927 588
ui_idle 4
ui_sync
ed_model frames on
ed_dump dropped
screenshot frames_moved

// A point and a triangle by their numbers; and one there is none of.
ed_pick find points 3
ed_dump point
ed_pick find faces 2
ed_dump face
ed_pick find faces 9999
ed_dump none
ed_model frames off
ui_idle 3
ui_sync
ed_dump away
quit
