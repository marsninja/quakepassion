// The logic graph, the clipboard, prefabs and groups, driven as a hand would
// drive them (scripts/validate_studio.jac). The window is the default 1280
// by 720; the graph's sheet starts at (285, 56).
edit
ui_idle 3
ui_sync
ed_scene logic
ui_idle 3
ui_sync

// A door of one brush, a button and a relay.
ed_cam 0 -420 260 90 -24
ed_box 64 64 96
ed_tie func_door
ed_new func_button
ed_new trigger_relay
ui_idle 3
ui_sync
ed_dump made

// Select the button and the relay and open the graph (L): they stand in its
// first column. Drag from the button's box to the relay's.
ed_select 5
ed_select 6 add
ui_click 700 600 1
ui_key l
ui_idle 4
ui_sync
ed_dump graphed
ui_drag 387 105 387 157
ui_idle 4
ui_sync
ed_dump linked

// The relay is now a column on. Add the door to the selection and drag from
// the relay to it.
ed_select 4 add
ui_idle 4
ui_sync
ui_drag 587 105 387 157
ui_idle 4
ui_sync
ed_dump chained
screenshot logic_graph

// A click on the door's box selects the door alone.
ui_click 787 105
ui_idle 3
ui_sync
ed_dump picked

// Back to the level (L). Copy the door and paste it where the camera looks.
ui_key l
ui_idle 3
ui_sync
ui_mod ctrl 1
ui_key c
ui_mod ctrl 0
ed_cam 150 -420 260 90 -24
ui_idle 2
ui_sync
ui_mod ctrl 1
ui_key v
ui_mod ctrl 0
ui_idle 4
ui_sync
ed_dump pasted

// Keep the selection as a prefab from the Library tab, then add a copy by
// clicking its row and place a linked one.
ui_click 203 67
ui_click 122 95
ui_type gate
ui_key ENTER
ui_idle 4
ui_sync
ed_cam -150 -420 260 90 -24
ui_click 46 162
ui_idle 4
ui_sync
ed_dump added
screenshot logic_library
ed_cam 0 -300 260 90 -24
ed_prefab link gate
ui_idle 4
ui_sync
ed_dump placed
ed_move 0 64 0
ui_idle 4
ui_sync
ed_dump shifted

// Two small boxes held together as a group (Ctrl+G).
ed_cam 0 -200 260 90 -40
ed_box 32 32 32
ui_idle 3
ui_sync
ed_dump crate
ed_duplicate
ui_idle 3
ui_sync
ed_dump twin
ed_select solid:12 add
ui_click 700 600 1
ui_mod ctrl 1
ui_key g
ui_mod ctrl 0
ui_idle 4
ui_sync
ed_dump grouped

// Save, play it, come back.
ed_save
ed_dump saved
ed_play
wait
wait
wait
wait
wait
wait
screenshot logic_playing
edit
ui_idle 3
ui_sync
ed_dump returned
quit
