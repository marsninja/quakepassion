// Materials at their true size: a Quake III texture fitted to a face, and an
// image file of the project's own (scripts/validate_studio.jac writes the
// image and names its folder in QP_TEXTURES).
edit
ui_idle 3
ui_sync
ed_scene skins
ui_idle 3
ui_sync
ed_cam 0 -420 260 90 -24
ed_box 128 128 96
ui_idle 3
ui_sync

// A 256 by 512 texture fitted once across the block's 128-unit top.
ed_face 3 4
ed_material q3:textures/base_wall/archpipe2_k_tall3fin
ed_tex fit
ui_idle 4
ui_sync
ed_dump arena

// The project's own image, four texels a side, fitted to the block's +x side.
ed_face 3 0
ed_material file:crate.png
ed_tex fit
ui_idle 4
ui_sync
ed_dump own

// The Materials tab lists the project's files; a click on the picture gives it to the face picked.
ed_face 3 2
ui_click 84 67
ed_shelf files
ui_idle 20
ui_sync
ui_click 42 302
ui_idle 4
ui_sync
ed_dump clicked
screenshot material_files
ed_check
quit
