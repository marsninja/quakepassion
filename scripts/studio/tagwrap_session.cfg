// A material carried round a pillar from one tagged wall; several faces
// tagged and a brush glued against the nearest; and trigger volumes and
// clip brushes outlined in colours of their own
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene pillar
ui_idle 3
ui_sync
ed_grid 16
ed_cam 0 -420 260 90 -24

// A pillar with one wall in another material, slid; that wall tagged, the
// four walls picked, and the material sent round them.
ed_box 64 64 128
ed_select
ed_material q1:e1m1/tech04_1
ed_paintface 3 0
ed_face 3 0
ed_tex shift 8 4
ed_tag
ed_face 3 1 add
ed_face 3 2 add
ed_face 3 3 add
ui_idle 3
ui_sync
ed_dump tagged
ed_tex wrap round
ui_idle 4
ui_sync
ed_dump wrapped
screenshot tagwrap_wrapped
ed_tex wrap round

// The wall across from it tagged as well; a box glued against whichever
// of the two it stands nearer.
ed_face 3 1
ed_tag add
ed_tag list
ed_select
ed_material blockout
ed_box 32 32 32
ed_move 192 0 0
ui_idle 3
ui_sync
ed_dump east
ed_glue
ui_idle 3
ui_sync
ed_dump glued_east
ed_move -400 0 0
ed_glue
ui_idle 3
ui_sync
ed_dump glued_west
ed_tag clear
ed_tag list
ed_glue

// A trigger volume and a clip brush, counted and then outlined.
ed_select
ed_box 64 64 64
ed_move 0 -160 0
ed_class trigger_once
ed_select
ed_material q3:textures/common/clip
ed_box 32 32 96
ed_move 160 -160 0
ed_select
ed_overlay
ed_overlay triggers on
ed_overlay unseen on
ui_idle 5
ui_sync
ed_dump outlined
screenshot tagwrap_outlined
ed_overlay triggers off
ed_overlay unseen
ed_overlay sideways
ui_idle 3
ui_sync
ed_dump plain
quit
