// The model's skin: a part laid flat on it, its places stretched, moved,
// turned and flipped and one of those undone; a picture made and painted,
// on the skin and through the model; shown with the part's triangles over
// it, and saved (scripts/validate_studio.jac runs this, and names the
// folder in QP_MODELS).
edit
ui_idle 3
ui_sync
ed_model new cylinder 64 64 96 8
ui_idle 6
ui_sync
ed_orbit 0 -80 300
ui_idle 3
ui_sync
ed_dump made

// Laid flat by looking down on it, into the left half of the skin; then
// stretched to half, moved, turned and flipped; the flip undone.
ed_skin project z 0 0 0.5 1
ed_dump laid
ed_skin scale 0.5
ed_skin move 0.25 0
ed_dump shaped
ed_skin turn 90
ed_skin flip u
ed_model undo
ed_dump turned

// A picture, painted on the skin; then through the model, where a click lands.
ed_skin new 64 64 40 40 40
ed_skin colour 255 0 0
ed_skin brush 6
ed_skin dab 0.9 0.9
ed_dump dabbed
ed_pick mode paint
ed_skin colour 0 255 0
ui_click 797 388
ui_sync
ed_dump painted

// Shown under the model with the part's triangles over it, and saved.
ed_skin show on
ui_idle 4
ui_sync
screenshot skin_view
ed_skin save tower.tga
ed_dump saved
quit
