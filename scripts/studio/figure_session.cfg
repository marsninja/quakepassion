// Figures: a Quake III body put together from its legs, torso and head as
// the game joins them, with a weapon in its hand, at rest and running while
// it attacks; and each game's weapon as it is held in view
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_layout assets
ui_idle 3
ui_sync
ed_body list

// Sarge, standing at rest with a machinegun.
ed_body
ui_idle 4
ui_sync
ed_dump stood
screenshot figure_stood

// Running, the torso attacking, with nothing in hand.
ed_body sarge none legs run torso attack
ed_frame 3
ui_idle 4
ui_sync
ed_dump running
ed_body visor rocketl legs idle torso stand
ui_idle 3
ui_sync
ed_dump other

// Quake's shotgun as the player holds it: at rest and through a shot.
ed_viewweapon q1 2
ui_idle 4
ui_sync
ed_dump shotgun
screenshot figure_shotgun
ed_frame 4
ed_dump firing

// Quake II's, and Quake III's on its hand with its barrel; from outside.
ed_viewweapon q2 2
ui_idle 3
ui_sync
ed_dump second
ed_viewweapon q3 2 out
ui_idle 4
ui_sync
ed_dump third
screenshot figure_machinegun

// What is not there.
ed_body nobody
ed_body sarge machinegun legs sideways
ed_viewweapon q9
ed_viewweapon q1 99
ed_dump refused

// Taken into the model editor, a body is a model like any other.
ed_body sarge none
ed_model edit
ui_idle 4
ui_sync
ed_dump edited
quit
