// More shapes, a shape built again from other numbers where it stands,
// freed into plain brushes, and the faces brushes cover of each other
// caulked (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene shapes
ui_idle 3
ui_sync
ed_grid 16

// Stairs with a landing: a group that keeps its numbers.
ed_shape landing 128 192 128 8
ui_idle 4
ui_sync
ed_dump landing
screenshot shapes_landing

// The same stairs built again taller and of twelve steps, where they stand.
ed_reshape 128 192 192 12
ui_idle 4
ui_sync
ed_dump rebuilt
ed_undo
ui_idle 4
ui_sync
ed_dump undone
ed_redo

// The faces its steps cover of each other are not drawn.
ed_caulk
ui_idle 4
ui_sync
ed_select child
ui_idle 2
ui_sync
ed_dump caulked
ed_select parent

// Freed, it is a plain group and cannot be built again.
ed_shape free
ed_reshape 64 64 64
ui_idle 4
ui_sync
ed_dump freed

// One of each of the other new kinds.
ed_select
ed_cam 0 -700 300 90 -20
ed_shape bicone 96 96 128
ed_shape torus 192 192 48 12 32
ed_shape xtree 96 96 128 3
ed_shape cap 128 32 64
ed_shape corner 64 64 64 6
ed_shape bevel 64 64 64
ed_shape column 64 64 160 8
ui_idle 6
ui_sync
ed_dump kinds
screenshot shapes_kinds

// With the setting on, a shape comes with its inner faces caulked.
ed_autocaulk on
ed_shape stairs 128 128 64 4
ui_idle 4
ui_sync
ed_select child
ui_idle 2
ui_sync
ed_dump auto
ed_save
quit
