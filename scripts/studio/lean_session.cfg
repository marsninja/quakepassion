// One box handle round the selection: its middle moves it, its corners turn
// it (with Shift, size it) and the middles of its edges shear it along the
// edge and size it across; then the same by number, and two brushes sheared
// as one (scripts/validate_studio.jac). The window is the default 1280 by 720.
edit
ui_idle 3
ui_sync
ed_scene lean
ui_idle 3
ui_sync
ed_layout 4
ed_grid 16
ui_idle 4
ui_sync

// Draw (6): a box twice as long as it is deep; then the box handle round it.
ui_click 788 300 1
ui_key 6
ui_idle 2
ui_sync
ui_drag 700 150 760 180
ui_idle 4
ui_sync
ui_key 1
ui_idle 2
ui_sync
ed_gizmo box
ui_idle 3
ui_sync
ed_dump boxed

// The middle of its right edge, taken up along the edge: the box leans, its
// left edge staying where it is.
ui_press 759 164
ui_move 759 158
ui_move 759 149
ui_idle 3
ui_sync
screenshot lean_shearing
ui_release 759 149
ui_idle 4
ui_sync
ed_dump sheared

// Sheared back by number, it is a box again (a little along, for the shear
// by number is about its middle).
ed_shear y x -0.25
ui_idle 4
ui_sync
ed_dump squared
ed_undo
ed_undo
ui_idle 3
ui_sync

// A corner taken a quarter of the way round the middle turns it.
ui_drag 759 150 714 135
ui_idle 4
ui_sync
ed_dump turned
ed_undo
ui_idle 3
ui_sync

// With Shift the corner sizes it instead, from the far corner.
ui_mod shift 1
ui_drag 759 150 789 150
ui_mod shift 0
ui_idle 4
ui_sync
ed_dump sized
ed_undo
ui_idle 3
ui_sync

// The middle of its top edge: pulled outward it sizes that way alone, and
// taken along the edge it shears the other way.
ui_drag 729 150 729 135
ui_idle 4
ui_sync
ed_dump taller
ed_undo
ui_idle 3
ui_sync
ui_drag 729 150 744 150
ui_idle 4
ui_sync
ed_dump leant
ed_undo
ui_idle 3
ui_sync

// Its middle moves it.
ui_drag 729 164 749 164
ui_idle 4
ui_sync
ed_dump moved
ed_undo
ui_idle 3
ui_sync

// In the front view the handle lies along x and z: its top edge taken along
// leans the box over.
ui_drag 392 532 402 532
ui_idle 4
ui_sync
ed_dump tipped
ed_undo
ui_idle 3
ui_sync

// A second box; both selected, one handle is round the two. Its right edge
// taken up shears them as one.
ui_click 788 300 1
ui_key 6
ui_idle 2
ui_sync
ui_drag 800 150 860 180
ui_idle 4
ui_sync
ui_key 1
ui_idle 2
ui_sync
ed_select solid:3 add
ui_idle 3
ui_sync
ed_dump pair
ui_drag 859 164 859 149
ui_idle 4
ui_sync
ed_dump both
screenshot lean_pair
ed_undo
ui_idle 3
ui_sync

// By number: leaning along x by half a unit for each unit of height, and a
// quarter turn said as what the axes become.
ed_shear x z 0.5
ui_idle 4
ui_sync
ed_dump numeric
ed_undo
ed_linear 0 1 0 -1 0 0 0 0 1 about 0 0 0 Turn
ui_idle 4
ui_sync
ed_dump linear
ed_undo
ed_linear 1 0 0 0 1 0 1 0 0
ed_shear x x 2
ed_dump refused

// In the 3D view the handle lies level across the selection's middle.
ed_layout 1
ed_cam -28 -300 300 90 -35
ui_idle 4
ui_sync
screenshot lean_3d
ed_dump level
quit
