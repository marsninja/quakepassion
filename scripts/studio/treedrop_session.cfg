// Rows carried in the side panels' lists: a brush put on a brush that a
// wall holds, back on the brushes' heading for the world, on the wall's
// class heading and on the wall's own row; the player's start carried from
// the list into the view; a favourite put before another, one put in the
// trash, and one carried into the view (scripts/validate_studio.jac runs
// this).
edit
ui_idle 3
ui_sync
ed_scene hands
ui_idle 3
ui_sync
ed_cam 0 -420 260 90 -24
ed_box 64 64 64
ed_cam 160 -420 260 90 -24
ed_box 64 64 32
ed_tie func_wall
ed_select
ed_fold class:brushes
ed_fold class:func_wall
ed_fold class:info_player_start
ed_fav light
ed_fav item_health
ed_fav monster_ogre
ui_idle 4
ui_sync
ed_tree
ed_dump listed

// The first box's row put on the row of the box the wall holds.
ui_drag 100 260 100 280
ui_idle 3
ui_sync
ed_tree
ed_dump beside

// Back to the world: on the brushes' heading.
ui_drag 100 260 100 220
ui_idle 3
ui_sync
ed_dump world

// On the heading of the wall's class (there is one wall), undone, and on
// the wall's own row.
ui_drag 100 260 100 140
ui_idle 3
ui_sync
ed_dump heading
ed_undo
ui_idle 3
ui_sync
ed_dump undone
ui_drag 100 260 100 160
ui_idle 3
ui_sync
ed_dump wall
screenshot treedrop_handed

// An entity is not held by another: the start put on the wall changes nothing.
ui_drag 100 200 100 160
ui_idle 3
ui_sync
ed_dump refused

// The start carried from the list and let go in the view, on the floor.
ed_cam 0 -420 260 90 -24
ui_idle 3
ui_sync
ui_drag 100 200 700 420
ui_idle 3
ui_sync
ed_dump carried

// The Library tab: the ogre put before the light, the health in the trash.
ed_select
ui_click 202 67
ui_idle 4
ui_sync
ui_drag 100 322 100 282
ui_idle 4
ui_sync
ed_dump ordered
ui_drag 100 322 100 342
ui_idle 4
ui_sync
ed_dump trashed
screenshot treedrop_favourites

// A favourite carried into the view is an entity there.
ui_drag 100 302 700 420
ui_idle 4
ui_sync
ed_dump light
ed_fav
quit
