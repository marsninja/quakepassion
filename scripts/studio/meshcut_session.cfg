// A model's triangles cut along a plane, at every frame alike, and a tag
// turned where it stands (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_layout assets
ui_idle 3
ui_sync

// A cylinder of two frames, the second half as tall again.
ed_model new cylinder 64 64 96 8
ed_model frame copy tall
ed_mesh scale 1 1 1.5
ui_idle 4
ui_sync
ed_dump made

// Cut across its height at 72 (measured on the tall frame, where it is
// half way up): every wall triangle is passed through, the caps are not.
ed_mesh cut z 72
ui_idle 4
ui_sync
ed_dump cut
screenshot meshcut_cut
ed_frame 0
ui_idle 3
ui_sync
ed_dump cut_short
// A plane that misses changes nothing; undone, it is as it was made.
ed_mesh cut z 500
ed_model undo
ui_idle 3
ui_sync
ed_dump undone
ed_model redo

// A tag on its top, turned a quarter about the upright at this frame,
// then tipped at every frame.
ed_model tag add tag_top 0 0 96
ed_model tag turn tag_top z 90
ed_model tag turn tag_top x 90 all
ed_model tag turn tag_none z 90
ed_frame 1
ed_model tag turn tag_top y 0
ed_model tag turn tag_top z 180
ed_dump turned
quit
