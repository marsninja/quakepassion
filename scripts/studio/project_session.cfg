// A project: a folder with a manifest and scenes of its own, made, filled,
// closed and another opened; add-ons of entity classes loaded, read again
// and dropped; and what a game's scenes begin with
// (scripts/validate_studio.jac runs this, and makes the project "old").
edit
ui_idle 3
ui_sync
ed_dump begin

// A project made: its scenes are saved under it and named in its manifest.
ed_project new keep "The keep"
ed_scene hall
ui_idle 6
ui_sync
ed_save
ed_scene yard
ui_idle 6
ui_sync
ed_save
ed_project start yard
ed_project set build quick
ed_project set bake 128
ed_material brick
ed_project set material
ed_recipe fine "ed_build full; ed_bake 128"
ui_idle 6
ui_sync
ed_dump kept

// An add-on from outside the project: its classes are offered, and an
// entity of one is made with what the class says of it.
ed_dump addon
ed_addon scripts/studio/fixtures/traps.txt
ed_addon
ed_new trap_spikes
ui_idle 2
ui_sync
ed_dump spikes
screenshot project_addon
ed_addon reload
ed_addon drop traps.txt
ed_dump dropped
ed_addon

// The Window menu's last entries: the project says what it is.
ed_dump menu
ui_click 251 12
ui_sync
screenshot project_menu
ui_click 274 257
ui_sync

// Closed; and one made before the session opened, with its scene and add-on.
ed_project close
ed_dump closed
ed_project open old
ui_idle 6
ui_sync
ed_dump old
ed_addon

// What a game's scenes begin with: kept in the settings, taken up by the
// next scene made outside a project.
ed_game passion material slate
ed_game passion build flat
ed_dump games
ed_game
ed_project close
ed_scene loose
ui_idle 6
ui_sync
ed_save
ed_dump loose
quit
