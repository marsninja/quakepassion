// What clicks pick (everything, brushes only, entities only); editing kept
// to the selection, and what it put away brought back, leaving what was
// hidden before; and a map off the grid forced on to it
// (scripts/validate_studio.jac runs this). The window is the default 1280 by 720.
edit
ui_idle 3
ui_sync
ed_scene keep
ui_idle 3
ui_sync
ed_layout 4
ed_grid 16
ui_idle 4
ui_sync

// Two boxes drawn in the plan, and an entity standing over the floor.
ui_click 788 300 1
ui_key 6
ui_idle 2
ui_sync
ui_drag 700 150 760 180
ui_idle 4
ui_sync
ed_select
ui_drag 800 150 860 180
ui_idle 4
ui_sync
ui_key 1
ed_new info_notnull
ed_set origin "0 -128 40"
ed_select
ui_idle 3
ui_sync
ed_dump made

// Entities only: a click on the first box passes it.
ed_pickmode entities
ui_click 729 164
ui_idle 3
ui_sync
ed_dump passed
// Brushes only: a click where the entity stands takes the floor under it.
ed_pickmode brushes
ed_select
ui_click 788 252
ui_idle 3
ui_sync
ed_dump floor
// Everything: the same click takes the entity.
ed_pickmode all
ed_select
ui_click 788 252
ui_idle 3
ui_sync
ed_dump entity

// The second box hidden; then editing kept to the first: the rest is put
// away, and brought back without the box that was hidden before.
ed_select solid:4
ed_hide
ed_select solid:3
ed_restrict
ui_idle 3
ui_sync
ed_dump kept
ed_restrict
ed_restrict on
ed_restrict off
ui_idle 3
ui_sync
ed_dump released
ed_restrict off
ed_show
ui_idle 3
ui_sync
ed_dump shown

// The first box and the entity knocked off the grid, and the whole map forced back.
ed_select solid:3
ed_move 3 5 1
ed_select class:info_notnull
ed_set origin "1 2 43"
ed_select
ed_snap all 16
ed_select solid:3
ui_idle 3
ui_sync
ed_dump mended
ed_select class:info_notnull
ed_dump stood
ed_snap all 16
quit
