// A map brought into the scene as a group; materials found by name across
// the games and shown as a shelf, and those lately in hand as another; and
// a whole folder written out of a game's archives
// (scripts/validate_studio.jac runs this, and names the folder in QP_EXTRACT).
edit
ui_idle 3
ui_sync
ed_scene finds
ui_idle 3
ui_sync
ed_dump empty

// A map file brought in under a group's name: its brushes and entities join the scene.
ed_import scripts/studio/fixtures/hall.map annex
ui_idle 4
ui_sync
ed_dump imported
ed_select
ed_import scripts/studio/fixtures/nothing_there.map
ed_dump missing

// Materials whose names hold a word, of every game: a shelf of their own.
ed_matfind crate
ui_click 84 67
ui_idle 6
ui_sync
ed_dump found
screenshot finds_shelf
ed_matfind no_such_material_anywhere

// Three taken in hand: the latest first, each once.
ed_material q1:e1m1/tech04_1
ed_material q2:e1u1/floor3_1
ed_material q1:e1m1/tech04_1
ed_material blockout
ed_material recent
ed_shelf recent
ui_idle 3
ui_sync
ed_dump recent

// Every file under a folder of Quake's archives, written out.
ed_extract folder q1:sound/doors
ed_extract folder q9:gfx
ed_extract folder q1:no/such/folder
ed_dump extracted
quit
