// Copies laid along a path a tile apart with an elbow at its bend; a fan
// of wedges; and a shape of one brush that keeps its numbers
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene fanned
ui_idle 3
ui_sync
ed_grid 16
ed_cam 0 -520 320 90 -28

// A post, and a path of three corners that turns once.
ed_box 16 16 32
ed_group post
ed_new path_corner
ed_set origin "-128 64 0"
ed_set targetname p1
ed_set target p2
ed_new path_corner
ed_set origin "128 64 0"
ed_set targetname p2
ed_set target p3
ed_new path_corner
ed_set origin "128 320 0"
ed_set targetname p3
// An image on each corner; then laid a tile apart, with an elbow at the bend.
ed_select class:func_group
ed_dup path p1
ui_idle 6
ui_sync
ed_dump cornered
ed_dup tile 64
ui_idle 6
ui_sync
ed_dump tiled
ed_tree post
screenshot fan_tiled
ed_dup tile 0
ed_dup tile off
ui_idle 6
ui_sync
ed_dump untiled
ed_dup off

// A fan of eight wedges, built again as twelve.
ed_select
ed_shape fan 128 128 32 8
ui_idle 5
ui_sync
ed_dump fan
ed_reshape 128 128 32 12
ui_idle 5
ui_sync
ed_dump finer

// A cone is one brush, and a shape still: built again taller, with six sides.
ed_select
ed_shape cone 64 64 96
ui_idle 5
ui_sync
ed_dump cone
ed_reshape 64 64 160 6
ui_idle 5
ui_sync
ed_dump taller
ed_select child
ui_idle 3
ui_sync
ed_dump its_brush
quit
