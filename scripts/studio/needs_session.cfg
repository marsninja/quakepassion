// What an entity needs that is not there: a shipped level lacks nothing; a
// class of another game, a sound no archive holds and one that is there;
// then in a scene of the studio's own a model no archive holds and one that
// is, and a class nobody has (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_check
ed_dump shipped

// Quake has no railgun.
ed_new weapon_railgun
ed_check
ed_dump railgun
ed_delete

// A sound that is not in Quake's archives, and one that is.
ed_new ambient_drip
ed_set noise misc/nothere.wav
ed_check
ed_dump silent
ed_set noise misc/talk.wav
ed_check
ed_dump heard
ed_delete

// A scene of the studio's own: each entity is asked of the game it carries.
ed_scene needs
ui_idle 3
ui_sync
ed_new misc_model
ed_set model models/mapobjects/nothere/lamp.md3
ed_check
ed_dump nomodel
ed_set model models/powerups/holdable/teleporter.md3
ed_check
ed_dump model
ed_new info_playr_start
ed_check
ed_dump misspelt
ui_idle 3
ui_sync
screenshot needs_checks
quit
