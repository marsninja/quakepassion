// The Passion districts' materials as data: listed, a slot given another
// material by name and from the one in hand, a district named, what the
// archives do not hold refused, the table checked through the game's own
// loader, and put back (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_district
ed_dump listed

// The first district's floor from Quake II; its wall from the material in hand.
ed_district 0 floor q2:e1u1/floor3_1
ed_material q1:e1m1/tech04_1
ed_district 0 wall
ed_district 0 name The Keep Below
ed_district
ed_dump changed

// What is not there, and what is not a slot or a district, changes nothing.
ed_district 0 trim q1:e1m1/no_such_texture
ed_district 0 trim blockout
ed_district 0 roof q2:e1u1/floor3_1
ed_district 9 floor q2:e1u1/floor3_1
ed_district
ed_dump refused

// Checked: every slot's material is in the archives, and a level's
// materials, loaded the game's own way, are the table's.
ed_district check
ed_dump checked

// The first district put back by itself; then all of them.
ed_district reset 0
ed_district
ed_dump one_back
ed_district 3 accent q3:textures/base_wall/concrete
ed_district reset
ed_district
ed_dump all_back
quit
