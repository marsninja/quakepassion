// Navigation for bots, baked: a scene's floors sampled on a grid and made
// into the data the games' bots route over; the engine's own router asked
// for ways over it (walked, jumped up, dropped, and none); what cannot be
// reached named; the ways drawn; a coarser bake; and all forgotten
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
// A shipped level has navigation of its own.
ed_nav bake
ed_nav
ed_scene routes
ui_idle 3
ui_sync

// A floor, a box too tall to climb and a box low enough to jump onto.
ed_cam 0 -420 260 90 -24
ed_box 64 64 64
ed_cam 160 -420 260 90 -24
ed_box 64 64 32
ui_idle 4
ui_sync
ed_nav
ed_dump built

ed_nav bake
ed_nav show on
ui_idle 4
ui_sync
ed_dump baked
screenshot nav_baked

// Across the floor; up the tall box (no way) and down from it (a drop);
// onto the low box (a jump); and to somewhere off the level.
ed_nav route 0 0 24 0 -200 24
ed_nav route 0 0 24 0 160 88
ed_nav route 0 160 88 0 0 24
ed_nav route 0 0 24 160 160 56
ed_nav route 0 0 24 900 900 24

// Something on the tall box cannot be reached; something on the low one can.
ed_new info_notnull
ed_set origin "0 160 88"
ed_new info_notnull
ed_set origin "160 160 56"
ed_nav check
ed_dump checked

// A coarser bake has fewer places to stand; then it is forgotten.
ed_nav bake 64
ed_dump coarse
ed_nav show off
ed_nav clear
ed_nav
ed_nav route 0 0 24 0 -200 24
ed_dump cleared
quit
