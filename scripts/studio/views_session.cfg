// The views: two, three and four of them, a ruler along the selection, zoom,
// names on every entity, remembered views listed and forgotten, a picture
// laid behind the plan, and the camera swung round and taken behind a face
// (scripts/validate_studio.jac writes the picture, runs this, then opens the
// studio again to find the settings kept).
edit
ui_idle 3
ui_sync
ed_scene views
ui_idle 3
ui_sync
ed_grid 16
ed_layout 2
ui_idle 4
ui_sync
ed_dump two
screenshot views_two
ed_layout 3
ui_idle 4
ui_sync
ed_dump three
ed_layout 4b
ui_idle 4
ui_sync
ed_dump column
screenshot views_column
ed_layout 4
ui_idle 4
ui_sync

// A box drawn in the plan: the axis views measure it along its edges.
ui_click 788 300 1
ui_key 6
ui_idle 2
ui_sync
ui_drag 700 150 760 180
ui_idle 4
ui_sync
ui_key 1
ui_idle 3
ui_sync
ed_dump measured
screenshot views_ruler

// Zoom: so many units up the axis views, then the plan alone twice as near.
ed_zoom 2048
ui_idle 3
ui_sync
ed_dump far
ui_move 788 300
ui_idle 3
ui_sync
ui_key =
ui_idle 3
ui_sync
ed_dump nearer
ed_zoom 1024

// Every entity named; two views remembered, listed, one forgotten.
ed_names on
ed_mark here
ed_cam 0 -600 400 90 -30
ed_mark there
ed_goto prev
ui_idle 3
ui_sync
ed_dump back
ed_marks
ed_unmark here
ed_unmark nowhere

// A picture behind the plan, two units to a pixel.
ed_backdrop .jac/screenshots/studio/backdrop.png top 0 0 2 150
ui_idle 4
ui_sync
ed_select 0
ui_idle 3
ui_sync
ed_dump laid
screenshot views_backdrop

// The camera swung a quarter round the box, at the distance it stood.
ed_select brush 0 1
ed_cam -192 -340 32 90 0
ui_idle 3
ui_sync
ed_dump before
ed_swing 90 0
ui_idle 3
ui_sync
ed_dump swung

// Behind the box's top: under it, looking up.
ui_key 2
ui_idle 2
ui_sync
ui_click 729 164
ui_idle 3
ui_sync
ed_behind
ui_idle 3
ui_sync
ed_dump behind
ui_key 1
ed_save
quit
