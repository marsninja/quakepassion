// The asset explorer and archive packing, driven as a hand would drive them
// (scripts/validate_studio.jac). The window is the default 1280 by 720.
edit
ui_idle 3
ui_sync
ed_scene crate
ui_idle 3
ui_sync
ed_cam 0 -420 260 90 -24
ed_box 64 64 64
ui_idle 3
ui_sync
ed_dump boxed

// The explorer in place of the level: open Quake II by a click, then its
// textures, and show one.
ed_layout assets
ui_idle 4
ui_sync
ui_click 326 86
ui_idle 4
ui_sync
ed_asset dir:q2:textures
ed_asset dir:q2:textures/e1u1
ed_asset file:q2:textures/e1u1/metal1_1.wal
ui_idle 5
ui_sync
ed_dump texture
screenshot assets_texture

// Its buttons: give it to the selected brush, and write it to disk.
ui_click 868 671
ui_idle 4
ui_sync
ed_dump used
ui_click 701 671
ui_idle 3
ui_sync

// A text file and a sound.
ed_asset file:q2:default.cfg
ui_idle 5
ui_sync
ed_dump text
screenshot assets_text
ed_asset file:q1:sound/misc/menu1.wav
ui_idle 3
ui_sync
ed_dump sound
// Its Play button.
ui_click 868 671
ui_idle 3
ui_sync

// A model: Quake's player, turned by a drag, stepped a frame by its button
// and set playing by another.
ed_asset file:q1:progs/player.mdl
ui_idle 5
ui_sync
ed_dump model
ui_drag 785 410 725 410
ui_idle 3
ui_sync
ui_click 666 643
ui_idle 4
ui_sync
ed_dump turned
screenshot assets_model
ui_click 712 643
// Ten frames a second of real time: long enough for a few.
ui_idle 6000
ui_sync
ed_dump playing
ed_frame stop
ed_asset file:q3:models/players/sarge/upper.md3
ui_idle 4
ui_sync
ed_dump arena

// A search by name across every game.
ed_assetfind metal1_1
ui_idle 4
ui_sync
screenshot assets_found
ed_assetfind

// Back to the level; pack the scene with the texture it uses, and a folder.
ed_layout 1
ui_idle 3
ui_sync
ed_pack scene .jac/studio-pack/crate.pk3
ed_pack .jac/studio-pack/extract .jac/studio-pack/extract.pak
ed_dump packed
quit
