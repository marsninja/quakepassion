// Layers: kept sets hidden and shown as one, whatever owns their members;
// what two layers share stays hidden while either is off; the layers that
// are off are saved with the map (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene tiers
ui_idle 4
ui_sync
ed_layout 4
ui_idle 3
ui_sync

// Two boxes drawn in the plan, each a layer, and both together a third.
ed_mode draw
ui_drag 700 150 760 180
ui_sync
ed_select
ui_drag 800 150 860 180
ui_sync
ed_mode brush
ed_select brush 0 1
ed_keep west
ed_select brush 0 2
ed_keep east
ed_select
ui_click 729 164
ui_mod shift 1
ui_click 830 165
ui_mod shift 0
ui_sync
ed_keep boxes
ed_select
ui_idle 4
ui_sync
ed_dump kept

// One layer hidden: its box is out of the views and of what is built for
// them, and a click where it stood goes to the floor.
ed_layer west hide
ui_idle 6
ui_sync
ed_dump hid
screenshot layers_hidden
ui_click 729 164
ui_sync
ed_dump through
ed_select

// The layer of both hidden as well; showing the first again does not bring
// its box back while the other still hides it.
ed_layer boxes hide
ed_layer west show
ui_idle 6
ui_sync
ed_dump both
ed_layer
ui_idle 2
ui_sync
screenshot layers_list
ui_key ESCAPE
ui_sync

// Clicked in the list it would toggle; by command here. Then one alone.
ed_layer boxes
ui_idle 6
ui_sync
ed_dump back
ed_layer east only
ui_idle 6
ui_sync
ed_dump only
ed_save

// Everything shown turns every layer on again.
ed_show
ui_idle 6
ui_sync
ed_dump shown
quit
