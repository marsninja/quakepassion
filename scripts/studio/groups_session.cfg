// A group with switches of its own: shown as outlines only, locked against
// clicks, left out of builds, tinted, hidden; its row in the scene list
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene groups
ui_idle 3
ui_sync
ed_layout 4
ed_grid 16
ui_idle 4
ui_sync

// A box drawn in the plan and made a group.
ui_click 788 300 1
ui_key 6
ui_idle 2
ui_sync
ui_drag 700 150 760 180
ui_idle 4
ui_sync
ui_key 1
ed_group pillar
ui_idle 4
ui_sync
ed_dump grouped

// Outlines only: the level is built without it while editing, and a click
// where it stands goes through to the floor.
ed_group_view grey
ui_idle 4
ui_sync
ed_dump grey
screenshot groups_grey
ui_click 729 164
ui_idle 3
ui_sync
ed_dump through

// Shown again but locked: built, and still passed by a click.
ed_select class:func_group
ed_group_view shown
ed_group_lock on
ui_idle 4
ui_sync
ed_dump locked
ed_select
ui_click 729 164
ui_idle 3
ui_sync
ed_dump passed

// Unlocked, a click takes its brush; then builds are told to skip it.
ed_select class:func_group
ed_group_lock off
ed_select
ui_click 729 164
ui_idle 3
ui_sync
ed_dump taken
ed_select class:func_group
ed_group_skip on
ui_idle 4
ui_sync
ed_dump skipped

// Built again, with outlines of its own colour; its row in the list (which
// selecting it opened its class to show) opened onto its brush.
ed_group_skip off
ed_group_tint 255 128 0
ui_idle 4
ui_sync
ed_dump tinted
ed_fold 4
ui_idle 4
ui_sync
ed_dump opened
screenshot groups_tinted
ed_groups

// Hidden: not shown, not built while editing.
ed_group_view hidden
ui_idle 4
ui_sync
ed_dump hidden
screenshot groups_hidden
ed_save
quit
