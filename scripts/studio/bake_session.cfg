// The bake: a hall with a wall across its middle is cut into cells, each
// with the cells it can see, and played, less of it is drawn from one side
// of the wall than when it is built as one
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_open scripts/studio/fixtures/hall.map
ui_idle 6
ui_sync
ed_dump opened

// Cut into cells 128 wide.
ed_bake 128
ui_idle 8
ui_sync
ed_dump baked
screenshot bake_cells

// Played from the west room, facing the wall: what is beyond it is not drawn.
ed_cam -192 0 56 0 0
ed_play here
ed_pause on
wait
wait
wait
wait
wait
wait
ed_played inside
ed_stop
ui_idle 4
ui_sync

// Built as one again, all of it is drawn from there.
ed_bake off
ui_idle 8
ui_sync
ed_dump whole
ed_cam -192 0 56 0 0
ed_play here
ed_pause on
wait
wait
wait
wait
wait
wait
ed_played unbaked
ed_stop
ui_idle 4
ui_sync
quit
