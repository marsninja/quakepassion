// The log panel: the console's last lines kept in sight along the foot of
// the views as work goes on, scrolled back and forward, made taller, and
// put away; and kept between sessions (scripts/validate_studio.jac runs
// this twice: the second time with the first's settings).
edit
ui_idle 3
ui_sync
ed_dump opened
ed_scene logged
ui_idle 3
ui_sync
ed_log panel on
ed_cam 0 -420 260 90 -24
ed_box 64 64 64
ed_nav route 0 0 0 1 1 1
ed_camps routes on
ui_idle 4
ui_sync
ed_dump shown
screenshot logpanel_shown

// Back through what was said, to the oldest, and forward again.
ed_log panel up 2
ui_idle 2
ui_sync
ed_dump back
ed_log panel up 9999
ui_idle 2
ui_sync
ed_dump oldest
screenshot logpanel_oldest
ed_log panel end
ui_idle 2
ui_sync
ed_dump newest

// Taller: twelve rows. And in four views it runs under all of them.
ed_log panel 12
ed_layout 4
ui_idle 4
ui_sync
ed_dump taller
screenshot logpanel_four
ed_layout 1
ed_log panel off
ui_idle 2
ui_sync
ed_dump away
ed_log panel on 5
ui_idle 2
ui_sync
ed_dump kept
quit
