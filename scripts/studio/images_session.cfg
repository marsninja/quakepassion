// A post copied as images, the copies made real, and the leak finder on a
// room with and without its roof (scripts/validate_studio.jac).
edit
ui_idle 3
ui_sync
ed_scene posts
ui_idle 3
ui_sync

// One post; four in a row as images of it.
ed_cam 0 -420 260 90 -24
ed_box 16 16 96
ui_idle 3
ui_sync
ed_dump post
ed_dup 3 48 0 0
ui_idle 4
ui_sync
ed_dump imaged
screenshot images_row

// Moving the post moves its images: the level is built again.
ed_move 0 32 0
ui_idle 4
ui_sync
ed_dump shifted

// The copies made real brushes of the group.
ed_dup apply
ui_idle 4
ui_sync
ed_dump real

// An open yard leaks; the red line runs to the void.
ed_leak
ui_idle 3
ui_sync
ed_dump leaking
screenshot images_leak

// A ring of walls round the player start still leaks, through the top...
ed_scene sealed
ui_idle 3
ui_sync
ed_cam 0 0 400 90 -90
ed_shape pipe 512 512 256 4 16
ui_idle 3
ui_sync
ed_dump ringed
ed_leak
ui_idle 3
ui_sync
ed_dump open

// ...until it has a roof.
ed_box 512 512 16
ed_move 0 0 256
ui_idle 3
ui_sync
ed_dump roofed
ed_leak
ui_idle 3
ui_sync
ed_dump sealed
quit
