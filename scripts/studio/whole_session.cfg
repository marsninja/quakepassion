// Faces put right: a ramp's slope tilted to a whole angle about its own
// middle, then laid through whole points; each a step of its own, undone;
// and every face of a selected brush asked at once
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene whole
ui_idle 3
ui_sync
ed_cam 0 -420 260 90 -24
ed_wedge 64 96 40
ui_idle 3
ui_sync
ed_dump made

// An upright side stands at whole angles already; the slope does not.
ed_face 3 0
ed_faceangle 15
ed_face 3 4
ed_faceangle 15
ui_idle 3
ui_sync
ed_dump tilted
ed_faceangle 15

// Tilted about its middle, its corners are off whole numbers: laid through whole points.
ed_integral
ui_idle 3
ui_sync
ed_dump whole
ed_integral

// Each was a step of its own.
ed_undo
ed_undo
ui_idle 3
ui_sync
ed_dump undone
ed_redo
ui_idle 3
ui_sync

// With the brush selected and no face picked, every face of it is asked: one needs it.
ed_select solid:3
ed_integral
ui_idle 3
ui_sync
ed_dump brush
ed_select
ed_integral
ed_faceangle
quit
