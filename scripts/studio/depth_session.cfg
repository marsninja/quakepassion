// Bands of depth and oblique views: the top view held to a band, what lies
// above it greyed and then left out (and no longer clicked), the band taken
// from the selection; the top view turned off its axis by command and the
// front by Alt and a right drag, and one straightened from its compass
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene shelves
ui_idle 4
ui_sync
ed_layout 4
ui_idle 3
ui_sync

// Two boxes drawn in the plan; the second lifted well above the first.
ed_mode draw
ui_drag 700 150 760 180
ui_sync
ed_select
ui_drag 800 150 860 180
ui_sync
ed_mode brush
ed_move 0 0 192
ui_idle 4
ui_sync
ed_dump made
ed_select

// The top view held to the depths about the floor: the lifted box is greyed
// there, and still clicked.
ed_depth top -32 96
ui_idle 3
ui_sync
ed_dump banded
screenshot depth_grey
ui_click 830 165
ui_sync
ed_dump greyclick
ed_select

// Left out instead, a click where it was goes to the floor beneath.
ed_outside hide
ui_idle 3
ui_sync
screenshot depth_hidden
ui_click 830 165
ui_sync
ed_dump hideclick
ed_select

// The band taken from the selection, and let go.
ed_select brush 0 2
ed_depth top selection
ed_dump fitted
ed_depth top off
ed_dump unbanded
ed_select

// The top view turned off its axis; the front view by Alt and a right drag.
ed_oblique top 45 -35
ui_idle 3
ui_sync
ed_dump oblique
ui_mod alt 1
ui_drag 420 520 520 520 1
ui_mod alt 0
ui_sync
ed_dump turned
screenshot depth_oblique

// A press on the top view's compass straightens it; a command the front.
ui_click 919 100
ui_sync
ed_dump straight
ed_oblique front off
ed_dump done
quit
