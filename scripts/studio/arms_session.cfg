// Handles on a picked face for its material: an arm stretched, swung by
// itself, and both turned together; the dot sliding the material; and the
// lie said in numbers (scripts/validate_studio.jac). The window is the
// default 1280 by 720.
edit
ui_idle 3
ui_sync
ed_scene arms
ui_idle 3
ui_sync
ed_layout 4
ed_grid 16
ui_idle 4
ui_sync

// Draw (6) a box; Faces (2), and its top picked in the plan.
ui_click 788 300 1
ui_key 6
ui_idle 2
ui_sync
ui_drag 700 150 760 180
ui_idle 4
ui_sync
ui_key 2
ui_idle 2
ui_sync
ui_click 729 164
ui_idle 3
ui_sync
ed_dump picked
ed_texhandles on
ui_idle 3
ui_sync
ed_dump shown

// The end of the first arm taken out to twice its length: the material is
// twice as coarse that way.
ui_press 749 164
ui_move 758 164
ui_move 768 164
ui_idle 3
ui_sync
screenshot arms_stretching
ui_release 768 164
ui_idle 4
ui_sync
ed_dump stretched
ed_undo
ui_idle 3
ui_sync

// Taken an eighth of the way round instead, that way of the material runs
// aslant and the other as it did.
ui_drag 749 164 744 150
ui_idle 4
ui_sync
ed_dump aslant
screenshot arms_aslant
ed_undo
ui_idle 3
ui_sync

// With Shift the arm turns both ways together, and stretches neither.
ui_mod shift 1
ui_drag 749 164 729 135
ui_mod shift 0
ui_idle 4
ui_sync
ed_dump turned
ed_undo
ui_idle 3
ui_sync

// The dot slides the material.
ui_drag 729 164 739 164
ui_idle 4
ui_sync
ed_dump slid
ed_undo
ui_idle 3
ui_sync

// The second arm, pulled in to half its length.
ui_drag 729 184 729 174
ui_idle 4
ui_sync
ed_dump finer
ed_undo
ui_idle 3
ui_sync

// In numbers; a lie whose two ways run together is refused.
ed_texlay 1 0 0 0 -1 0 8 4 0.5 0.5
ui_idle 4
ui_sync
ed_dump numeric
ed_texlay 1 0 0 1 0 0 0 0 1 1
ed_texlay 1 0 0
ed_dump refused
ed_texhandles off
ui_idle 3
ui_sync
ed_dump hidden
quit
