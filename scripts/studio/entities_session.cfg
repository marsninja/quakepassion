// Entities by skill and mode, a value replaced across them, the deeper
// logic audit, a pasted gadget that keeps its own names, and a door set off
// by hand in a game held still (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene crowd
ui_idle 3
ui_sync
ed_grid 16

// A door of one box, and a button that opens it.
ed_class func_door
ed_set targetname door1
ed_new func_button
ed_set target door1
// A monster left out on easy, and health left out of deathmatch.
ed_new monster_ogre
ed_set spawnflags 256
ed_new item_health
ed_set spawnflags 2048
ui_idle 4
ui_sync
ed_dump made

// The level as it would spawn on easy, in deathmatch, and whole again.
ed_spawn easy
ui_idle 4
ui_sync
ed_dump easy
ed_spawn deathmatch
ui_idle 4
ui_sync
ed_dump deathmatch
ed_spawn all
ui_idle 4
ui_sync
ed_dump everything

// The ogre left out on hard as well, by the option every class has.
ed_select class:monster_ogre
ed_flag 10 1
ui_idle 3
ui_sync
ed_dump flagged
screenshot entities_skill

// Part of a value replaced on every entity that has it, and undone.
ed_refield target door gate all
ui_idle 3
ui_sync
ed_select class:func_button
ed_dump replaced
ed_undo

// The audit: the health waits for a name nothing fires.
ed_select class:item_health
ed_set targetname vault
ed_check logic

// The door and its button copied and pasted: the pair takes names of its own.
ed_select class:func_button
ed_select class:func_door add
ed_copy
ed_paste
ui_idle 4
ui_sync
ed_dump pasted

// Played and held still: the door is shut until its name is fired by hand,
// and time is let on.
ed_cam 0 -300 80 90 0
ed_play here
ed_pause on
wait
wait
wait
wait
ed_played shut
ed_fire door1
ed_fire nothing_named_this
ed_tick 20
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
wait
ed_played fired
ed_stop
ui_idle 4
ui_sync
ed_dump back
ed_save
quit
