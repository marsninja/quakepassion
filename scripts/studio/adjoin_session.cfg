// A face pick spread to the faces that adjoin it in its plane and to the
// faces beside it; sides that make no face pruned; brushes lined up with
// a kept set; and the history gone back through and forward again
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene tiles
ui_idle 3
ui_sync
ed_grid 16
ed_cam 0 -420 260 90 -24
ed_import scripts/studio/fixtures/tiles.map
ui_idle 5
ui_sync
ed_dump brought

// The top of the first tile: its plane holds four tops, but only three
// adjoin one another; the fourth is across the room.
ed_face 3 4
ed_faces adjoining
ui_idle 3
ui_sync
ed_dump adjoining
ed_faces extend
ui_idle 3
ui_sync
ed_dump extended
// One face again, and the four beside it on its own brush.
ed_face 3 4
ed_faces beside
ui_idle 3
ui_sync
ed_dump beside

// The check names the brush with a side that makes no face; pruned, it
// has six, and nothing else is touched.
ed_check
ed_select
ed_prune all
ed_prune all
ed_check
ui_idle 3
ui_sync
ed_dump pruned

// The lower box kept as a set; the far tile lined up with its low side
// along y, then with its high side along z.
ed_select solid:7
ed_keep step
ed_select solid:6
ed_align y low to step
ed_align z high to step
ed_align z high to nowhere
ui_idle 3
ui_sync
ed_dump aligned

// Back through the last three edits, forward two, and the list of both.
ed_history list
ed_history 3
ui_idle 3
ui_sync
ed_dump back
ed_history redo 2
ed_history list
ui_idle 3
ui_sync
ed_dump forward
quit
