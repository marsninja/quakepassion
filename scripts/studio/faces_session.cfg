// Brushes built on a picked face (walls, a cone, the face pushed out), side
// flags, and a digger whose brush is a hole in what is built
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene faces
ui_idle 3
ui_sync
ed_layout 4
ed_grid 16
ui_idle 4
ui_sync

// Draw (6): a box in the top view.
ui_click 788 300 1
ui_key 6
ui_idle 2
ui_sync
ui_drag 700 150 760 180
ui_idle 4
ui_sync
ed_dump drawn

// Faces (2): a click in the top view picks the box's top.
ui_key 2
ui_idle 2
ui_sync
ui_click 729 164
ui_idle 3
ui_sync
ed_dump picked

// Walls round that face's edge: four brushes, left selected.
ed_walls 32 16
ui_idle 4
ui_sync
ed_dump walled
screenshot faces_walls
ed_undo

// A cone on it.
ui_key 2
ui_click 729 164
ui_idle 3
ui_sync
ed_cone 48
ui_idle 4
ui_sync
ed_dump coned
screenshot faces_cone
ed_undo

// The face pushed out into a brush of its own, marked as detail; then one
// of the new brush's faces given a surface flag.
ui_key 2
ui_click 729 164
ui_idle 3
ui_sync
ed_extrude 32
ui_idle 4
ui_sync
ed_dump extruded
ed_detail
ui_key 2
ui_click 729 164
ui_idle 3
ui_sync
ed_sideflag flags 4
ui_idle 2
ui_sync
ed_dump flagged

// A smaller box drawn inside the first becomes a digger: the level is built
// with a shaft through the first box, and the document keeps both whole.
ui_key 1
ed_select
ui_key 6
ui_idle 2
ui_sync
ui_drag 715 158 745 172
ui_idle 4
ui_sync
ui_key 1
ui_idle 2
ui_sync
ed_dump inner
ed_digger
ui_idle 4
ui_sync
ed_dump dug
screenshot faces_dug
ed_digger off
ui_idle 4
ui_sync
ed_dump filled
ed_undo
ui_idle 4
ui_sync
ed_dump dug_again
ed_save
quit
