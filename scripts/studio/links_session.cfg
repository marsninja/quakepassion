// Linked faces, a carve that keeps divided faces linked, a mitred seam and
// merged corners (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene joined
ui_idle 4
ui_sync
ed_layout 4
ui_idle 3
ui_sync

// Two boxes drawn side by side in the plan.
ed_mode draw
ui_drag 700 150 760 180
ui_sync
ed_select
ui_drag 800 150 860 180
ui_sync
ed_mode brush
ed_select
ui_click 729 164
ui_mod shift 1
ui_click 830 165
ui_mod shift 0
ui_sync
ed_dump both

// Linked where they share a plane: tops, bottoms, fronts and backs. Then
// the top of one pushed up: the other's goes with it, and one undo brings
// both back.
ed_facelink
ed_dump linked
ed_select brush 0 1
ed_push 4 32
ui_idle 4
ui_sync
ed_select brush 0 2
ed_dump pushed
ed_undo
ui_idle 3
ui_sync
ed_select brush 0 2
ed_dump unpushed
ed_facelink clear
ed_dump cleared

// A cutter drawn across the first box; carved with links, the two pieces
// it leaves keep their divided faces as one.
ed_select
ed_mode draw
ui_drag 715 140 745 190
ui_sync
ed_mode brush
ed_carve link
ui_idle 4
ui_sync
ed_dump carved
ed_delete

// Two walls drawn through one corner, and cut to meet in a seam.
ed_select
ed_mode draw
ui_drag 700 250 780 258
ui_sync
ed_select
ui_drag 700 250 708 290
ui_sync
ed_mode brush
ed_select
ui_click 760 254
ui_mod shift 1
ui_click 704 280
ui_mod shift 0
ui_sync
ed_dump walls
ed_miter
ui_idle 4
ui_sync
ed_dump mitred
screenshot links_miter

// A top corner of the second box moved down onto the one beneath it.
ed_select
ui_click 830 165
ui_sync
ed_merge 232 208 64 232 208 0
ui_idle 4
ui_sync
ed_dump merged
screenshot links_merged
ed_save
quit
