// More of the terrain: a rectangle of it lifted, its cells split another
// way, a peak worn down, its tops painted, and the whole of it left as
// plain brushes (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene land
ui_idle 3
ui_sync
ed_cam 0 -520 420 90 -40
ed_terrain 4 4 64
ui_idle 4
ui_sync
ed_dump made

// Every corner inside a rectangle that takes the whole terrain in goes up.
ed_terrain lift -4096 -4096 4096 4096 32
ui_idle 4
ui_sync
ed_dump lifted

// Its cells split along alternate diagonals: the same brushes in number.
ed_terrain pattern alt
ui_idle 4
ui_sync
ed_dump split

// A peak raised where the camera looks, then worn down by erosion.
ed_sculpt raise 100 96
ui_idle 4
ui_sync
ed_dump peak
ed_sculpt erode 2000 24
ui_idle 4
ui_sync
ed_dump worn
screenshot land_worn

// The tops under the brush take the material in hand.
ed_material moss
ed_sculpt paint 4000
ui_idle 4
ui_sync
ed_dump painted

// Left as plain brushes: no grid to sculpt any more.
ed_terrain free
ed_sculpt raise 100 96
ui_idle 4
ui_sync
ed_dump freed
ed_save
quit
