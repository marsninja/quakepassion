// The inspector's controls that are dragged: a light's strength on a slider
// and its colour on three bars, its place in a field of three numbers, and
// which handles a brush shows on a radio
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene controls
ui_idle 3
ui_sync
ed_new light
ui_idle 6
ui_sync
ed_dump start

// The slider's knob taken from 300 to the middle of its bar.
ui_drag 1058 624 1115 624
ui_idle 4
ui_sync
ed_dump bright

// The green bar, to half.
ui_drag 1132 663 1132 664
ui_idle 4
ui_sync
ed_dump tinted

// The third of the three numbers, dragged twenty pixels: five grid steps up.
ui_drag 1214 598 1234 598
ui_idle 4
ui_sync
ed_dump moved
screenshot controls_light

// A brush's form ends with which handles it shows.
ed_select
ed_box 64 64 64
ui_idle 6
ui_sync
ui_click 1082 410
ui_idle 3
ui_sync
ed_dump turn
ui_click 1158 410
ui_idle 3
ui_sync
ed_dump size
ui_click 1236 410
ui_idle 3
ui_sync
ed_dump box
ui_click 1158 410
ui_idle 3
ui_sync
screenshot controls_brush
ed_save
quit
