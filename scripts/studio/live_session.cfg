// A played game watched: what fires counted and named, a firing that holds
// the game still, and the live player and signals looked at and changed
// while it is held (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene wired
ui_idle 3
ui_sync
ed_grid 16

// A door, a relay that opens it, and a relay that fires that one.
ed_class func_door
ed_set targetname door1
ed_new trigger_relay
ed_set targetname first
ed_set target door1
ed_new trigger_relay
ed_set targetname start
ed_set target first
ed_select
ui_idle 4
ui_sync
ed_break first
ed_dump made

// Played: nothing has fired. The first relay set off by hand with the game
// running: the firing reaches the one that holds the game, and it is held.
ed_cam 0 -300 80 90 0
ed_play here
wait
wait
wait
ed_fired quiet
ed_fire start
wait
wait
wait
ed_played broke
ed_fired after

// Held: the player and the signals as they stand, then changed.
ed_live
ed_live player health 37
ed_live player at 0 -200 40
ed_live signal first off
ed_fired changed
ed_live

// Fired again with the middle relay off: the firing stops there.
ed_fire start
ed_tick 5
wait
wait
wait
wait
wait
wait
ed_fired again
ed_stop
ui_idle 4
ui_sync

// Back in the studio the counts are still there, and on the logic graph.
ed_fired stopped
ed_break
ed_layout logic
ui_idle 4
ui_sync
screenshot live_graph
ed_dump graph
quit
