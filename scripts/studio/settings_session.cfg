// Keys bound by hand, the list of settings, the grid hidden and shown with
// its numbers, materials as flat tones, and the developer's readout; then
// the studio opened again to find them kept
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene settings
ui_idle 3
ui_sync
ed_layout 4
ed_grid 16
ui_idle 4
ui_sync

// A key of one's own: K adds a column, and Shift+K a cap.
ed_bind k ed_shape column 64 64 128
ed_bind shift+k ed_shape cap 128 32 64
ui_click 330 100 1
ui_key k
ui_idle 4
ui_sync
ed_dump column
ui_mod shift 1
ui_key k
ui_mod shift 0
ui_idle 4
ui_sync
ed_dump cap
ed_binds
ed_unbind shift+k
ui_mod shift 1
ui_key k
ui_mod shift 0
ui_idle 4
ui_sync
ed_dump unbound

// The settings, each a line; the second hides the grid.
ed_settings
ui_idle 3
ui_sync
screenshot settings_list
ui_click 340 117
ui_idle 4
ui_sync
ed_settings
ui_idle 2
ui_sync
ui_key ESCAPE
ui_idle 2
ui_sync
screenshot settings_nogrid
ed_grid show

// Flat tones in place of textures, and back.
ed_display solid
ui_idle 6
ui_sync
ed_dump solid
screenshot settings_solid
ed_display textured 3d
ui_idle 6
ui_sync
ed_dump textured

// The developer's readout in the status bar.
ed_dev on
ui_idle 4
ui_sync
screenshot settings_dev
ed_save
quit
