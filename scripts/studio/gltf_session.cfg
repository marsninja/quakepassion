// A model written as a glb and read back: a cylinder with a box round it
// as a second part (scripts/validate_studio.jac runs this, and names the
// folder in QP_MODELS).
edit
ui_idle 3
ui_sync
ed_layout assets
ui_idle 3
ui_sync
ed_model new cylinder 64 64 96 8
ed_model boxpart
ui_idle 4
ui_sync
ed_dump made
ed_model save keep.glb
ed_model close
ui_idle 3
ui_sync
ed_dump closed

// Read back: two parts under their own names, the cylinder as it was.
ed_model open keep.glb
ui_idle 4
ui_sync
ed_dump back
ed_model part 1
ui_idle 3
ui_sync
ed_dump box
ed_model part
quit
