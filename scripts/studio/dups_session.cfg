// Duplicators: copies in a row that grow, mirrored on two axes, hidden and
// shown; images at named points and along a path; a door whose images are
// doors of their own (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene dups
ui_idle 3
ui_sync
ed_grid 16

// A post, and three copies of it in a row.
ed_box 16 16 64
ed_dup 3 32 0 0
ui_idle 4
ui_sync
ed_dump row

// Each copy half as big again; then the whole row mirrored on x and y.
ed_dup grow 1.5
ed_dup axis x
ed_dup mirror xy
ed_dup materials brick stone
ui_idle 4
ui_sync
ed_dump mirrored
screenshot dups_mirrored

// Images left out of what is built, and put back.
ed_dup hide
ui_idle 4
ui_sync
ed_dump hidden
ed_dup show
ui_idle 4
ui_sync
ed_dump shown
ed_dup off
ui_idle 4
ui_sync
ed_dump stopped

// Two entities named torch: an image of the post at each.
ed_new info_notnull
ed_set targetname torch
ed_set origin 128 128 0
ed_new info_notnull
ed_set targetname torch
ed_set origin -128 128 0
ed_select class:func_group
ed_dup at torch
ui_idle 4
ui_sync
ed_dump torches

// Three path corners: an image at each, in place of those.
ed_dup at none
ed_new path_corner
ed_set targetname p1
ed_set target p2
ed_set origin 0 -128 0
ed_new path_corner
ed_set targetname p2
ed_set target p3
ed_set origin 128 -128 0
ed_new path_corner
ed_set targetname p3
ed_set origin 128 -200 0
ed_select class:func_group
ed_dup path p1
ui_idle 4
ui_sync
ed_dump pathed
screenshot dups_path

// The images made real: the group holds four brushes and copies nothing.
ed_dup apply
ui_idle 4
ui_sync
ed_dump real

// A door with two images that are doors of their own, named in turn.
ed_select
ed_class func_door
ed_set targetname door1
ed_dup 2 0 96 0
ed_dup each on
ui_idle 4
ui_sync
ed_dump doors
ed_cam 0 -300 80 90 0
ed_play here
ed_pause on
wait
wait
wait
wait
ed_played three
ed_fire door2
ed_tick 20
