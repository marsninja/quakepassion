// Prefabs within prefabs, and instances that differ: a post kept as a
// prefab, a gate kept as a prefab that holds two posts, the gate linked into
// a scene and built with both posts, an instance given another material
// and names of its own, and the built map written out to look at
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene nesting
ui_idle 3
ui_sync
ed_grid 16
ed_cam 0 -420 260 90 -24

// A post, kept as a prefab, and taken out again.
ed_box 16 16 64
ui_idle 3
ui_sync
ed_prefab save post
ed_delete

// Two posts linked in, and a lintel across them: kept together as a gate.
ed_prefab link post
ed_set origin "-64 0 0"
ed_prefab link post
ed_set origin "64 0 0"
ed_prefab swap blockout slate
ed_box 160 16 16
ed_move 0 0 64
ed_group lintel
ed_select class:misc_prefab
ed_select class:func_group add
ed_dump parts
ed_prefab save gate
ed_delete
ui_idle 4
ui_sync
ed_dump bare

// The gate linked into the scene: one entity, built as a lintel and two posts.
ed_prefab link gate
ed_set origin "0 128 0"
ui_idle 6
ui_sync
ed_dump gate
screenshot nest_gate

// This instance differs: brass for blockout, and names of its own.
ed_prefab swap blockout brass
ed_prefab names _north
ui_idle 6
ui_sync
ed_dump differs
ed_run true
ed_dump written
quit
