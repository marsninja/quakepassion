// What a build is made of beyond the studio's own: the cells of a bake
// drawn from where the camera or an entity is, a bake kept and given back
// when the same thing is built again, recipes of commands kept by name, and
// another program run over the map with what it says gone to
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_open scripts/studio/fixtures/hall.map
ui_idle 6
ui_sync
ed_dump opened

// Cut into cells and shown: from the west room, then from the east.
ed_bake 128
ui_idle 8
ui_sync
ed_cells on
ed_cam -192 0 56 0 0
ui_idle 3
ui_sync
ed_dump west
ed_layout 4
ui_idle 3
ui_sync
screenshot steps_cells
ed_cam 192 0 56 0 0
ui_idle 3
ui_sync
ed_dump east

// With the player start selected they are shown from where it stands.
ed_select brush 1
ui_idle 3
ui_sync
ed_dump start
ed_select

// A wall moved, and the move undone: built of the same thing again, the
// bake kept from before is given back.
ed_select brush 0 6
ed_move 0 0 16
ui_idle 8
ui_sync
ed_dump moved
ed_undo
ui_idle 8
ui_sync
ed_dump undone
ed_select

// Played and stopped: the same bake again both times.
ed_cam -192 0 56 0 0
ed_play here
ed_pause on
wait
wait
wait
wait
wait
wait
ed_played inside
ed_stop
ui_idle 6
ui_sync
ed_dump stopped

// Recipes: kept, listed, run, forgotten. The Play menu's last entry lists them.
ed_recipe quick "ed_build quick; ed_bake off"
ed_recipe fine "ed_build full; ed_bake 128"
ed_dump recipes
ed_recipe
ui_idle 2
ui_sync
screenshot steps_recipes
ui_key ESCAPE
ui_sync
ed_make quick
ui_idle 8
ui_sync
ed_dump quick
ed_make fine
ui_idle 8
ui_sync
ed_dump fine
ed_recipe quick
ed_dump forgot
ed_recipe
ui_key ESCAPE
ui_sync

// Another program run over the map: what it says of entities, brushes and
// lines is listed, and each can be gone to.
ed_dump ran
ed_run sh scripts/studio/fixtures/fake_compiler.sh %map%
ui_idle 2
ui_sync
ed_check 0
ui_sync
ed_dump first
ed_check 1
ui_sync
ed_dump second
ed_check 2
ui_sync
ed_dump third
quit
