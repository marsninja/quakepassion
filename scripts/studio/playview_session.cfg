// How the explorer's model is played and drawn: a range of frames at a
// speed of its own, once or round again, with frames between; the faces
// turned away left out; every point ticked; and a model's box at each
// frame kept as a part (scripts/validate_studio.jac runs this, and names
// the folder in QP_MODELS).
edit
ui_idle 3
ui_sync
ed_layout assets
ui_idle 3
ui_sync
ed_asset file:q1:progs/soldier.mdl
ui_idle 4
ui_sync
ed_dump shown

// Frames eight to fourteen, thirty a second: it comes in at the first of
// them, and stepped on from the last it is at the first again.
ed_frame range 8 14
ed_frame fps 30
ui_idle 3
ui_sync
ed_dump ranged
ed_frame 14
ed_frame next
ed_dump round
// Once: stepped on from the last, it stays there.
ed_frame once
ed_frame 14
ed_frame next
ed_dump once
ed_frame play
ui_idle 3
ui_sync
ed_dump playing
ed_frame stop
ed_frame loop
ed_frame range all
ed_frame fps 10
ed_frame 0

// Without the faces turned away there are fewer edges; every point ticked.
ed_model backs off
ed_model ticks 2
ui_idle 4
ui_sync
ed_dump fronts
screenshot playview_fronts
ed_model backs on
ed_model ticks off
ed_frame smooth on
ed_frame smooth off
ed_frame fps
ed_model backs maybe
ui_idle 3
ui_sync
ed_dump plain

// The legs of one of Quake III's players play the sequences of its table:
// running, round and round at the table's own speed; not the torso's.
ed_asset file:q3:models/players/sarge/lower.md3
ui_idle 4
ui_sync
ed_frame clip list
ed_frame clip run
ed_frame clip attack
ed_frame smooth 3
ui_idle 3
ui_sync
ed_dump running
ed_frame smooth off
ed_frame loop
ed_frame range all
ed_frame fps 10

// A model of two frames: its box at each frame becomes a part of it.
ed_model new cylinder 64 64 96 8
ed_model frame copy raised
ed_mesh move 0 0 16
ed_model boxpart
ui_idle 4
ui_sync
ed_dump boxed
ed_model part 1
ed_frame 0
ed_dump low_box
ed_frame 1
ed_dump high_box

// A box round only what is picked: one of the cylinder's walls.
ed_model part 0
ed_frame 0
ed_model boxpart picked
ed_pick faces 0 1
ed_model boxpart picked
ed_model part 2
ui_idle 3
ui_sync
ed_dump picked_box
quit
