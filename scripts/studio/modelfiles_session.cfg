// A model kept in a work file with everything the editor knows of it, and
// written as Quake's and Quake II's own files and read back
// (scripts/validate_studio.jac runs this, and names the folder in
// QP_MODELS).
edit
ui_idle 3
ui_sync
ed_layout assets
ui_idle 3
ui_sync

// A cylinder of two frames, the second sixteen higher; a tag on its top;
// two bones that carry its points; a skin of one colour; its top picked.
ed_model new cylinder 64 64 96 8
ed_model frame copy raised
ed_mesh move 0 0 16
ed_model tag add tag_top 0 0 96
ed_bone add upper 0 0 0 0 0 48
ed_bone chain fore 0 0 96
ed_bone auto
ed_skin new 64 32 200 60 20
ed_pick faces 16 17 18 19 20 21 22 23
ui_idle 3
ui_sync
ed_dump made

// The work file, and the games' files beside it.
ed_model save keep.qpm
ed_model save keep.mdl
ed_model save keep.md2
ed_model save keep.txt
ed_model close
ui_idle 3
ui_sync
ed_dump closed

// The work file opens as the model was left: the frame in hand, the
// pick, the tag and the bones.
ed_model open keep.qpm
ui_idle 4
ui_sync
ed_dump work
ed_bone weights

// Quake's file: one mesh of both frames, its skin inside it.
ed_skin new 8 8
ed_model open keep.mdl
ui_idle 4
ui_sync
ed_dump quake
screenshot modelfiles_quake

// Quake II's.
ed_model open keep.md2
ui_idle 4
ui_sync
ed_dump second
ed_model open keep.txt
quit
