// A scene of brushes, driven as a hand would drive it (scripts/validate_studio.jac).
// The level view is 670 by 634 at (285, 56) in the default window, so its
// middle is (620, 373).
edit
ui_idle 3
ui_sync
ed_scene yard
ui_idle 3
ui_sync
ed_dump opened
screenshot scene_new

// A box where the camera looks (past the player start): it lands on the floor.
ed_cam 0 -420 260 90 -24
ed_box 128 128 96
ui_idle 3
ui_sync
ed_dump boxed

// Look at it level, from the far side (so the player start is behind it),
// and select it with the pointer.
ed_cam 0 500 48 -90 0
ed_focus
ui_key ESCAPE
ui_idle 2
ui_sync
ed_dump cleared
ui_click 640 400
ui_idle 2
ui_sync
ed_dump picked
screenshot scene_picked

// Drag the handle on its top upward: the side follows.
ui_drag 620 274 620 224
ui_idle 3
ui_sync
ed_dump resized

// Drag the brush itself sideways.
ui_drag 640 400 700 400
ui_idle 3
ui_sync
ed_dump moved

// Give it a material from the inspector.
ui_click 1150 123
ui_mod ctrl 1
ui_key a
ui_mod ctrl 0
ui_type brick
ui_key ENTER
ui_idle 3
ui_sync
ed_dump painted

// Hand it to a door, then undo and redo that.
ui_click 1100 263
ui_type func_door
ui_key ENTER
ui_idle 3
ui_sync
ed_dump tied
ui_click 700 600 1
ui_mod ctrl 1
ui_key z
ui_mod ctrl 0
ui_idle 3
ui_sync
ed_dump untied
ui_mod ctrl 1
ui_key y
ui_mod ctrl 0
ui_idle 3
ui_sync
ed_dump retied
screenshot scene_edited

// A second brush, duplicated from the keyboard.
ed_box
ui_idle 3
ui_sync
ui_mod ctrl 1
ui_key d
ui_mod ctrl 0
ui_idle 3
ui_sync
ed_dump copied

// Save, play it, come back.
ed_save
ed_dump saved
ed_play
wait
wait
wait
wait
wait
wait
screenshot scene_playing
edit
ui_idle 3
ui_sync
ed_dump returned
screenshot scene_returned
quit
