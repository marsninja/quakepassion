// Where a map's logic can leave a player stuck (things that wait on what
// is never set off, a counter more must fire than can, a key the level
// has not got), and the bits of a brush side's contents and flags by the
// names Quake II and Quake III have for them (scripts/validate_studio.jac
// runs this).
edit
ui_idle 3
ui_sync
ed_scene stuck
ui_idle 3
ui_sync
ed_grid 16

// A button fires a relay that opens a door: nothing is stuck.
ed_class func_door
ed_set targetname door1
ed_new trigger_relay
ed_set targetname pass
ed_set target door1
ed_new func_button
ed_set target pass
ui_idle 3
ui_sync
ed_check logic
ed_dump sound

// Without the button the relay waits on nothing (the audit's to say), and
// the door on a relay that is never set off.
ed_delete
ui_idle 3
ui_sync
ed_check logic
ed_dump dead

// A counter of three fires the relay, and two soldiers' deaths fire the
// counter: the door is set off in the end, but the count is never made.
ed_new trigger_counter
ed_set targetname tally
ed_set count 3
ed_set target pass
ed_new monster_soldier
ed_set target tally
ed_new monster_soldier
ed_set target tally
ui_idle 3
ui_sync
ed_check logic
ed_dump short
// A trigger that can be walked into again and again makes the count up.
ed_new trigger_multiple
ed_set target tally
ui_idle 3
ui_sync
ed_check logic
ed_dump counted

// A lock that wants a key the level has not got, and then has.
ed_new trigger_key
ed_set item key_data_cd
ed_set target pass
ui_idle 3
ui_sync
ed_check logic
ed_dump keyless
ed_new key_data_cd
ui_idle 3
ui_sync
ed_check logic
ed_dump keyed

// The door's brush: its sides made a ladder a monster cannot pass, by the
// names Quake II has (a scene is of no one game, and is read as Quake II's
// unless told); one name taken off again; a name Quake II has not got
// refused, and taken when it is said to be Quake III's.
ed_sideflag names
ed_select class:func_door
ed_sideflag contents ladder
ed_sideflag contents monsterclip on
ed_sideflag flags slick
ed_sideflag
ui_idle 3
ui_sync
ed_dump named
ed_sideflag contents monsterclip off
ed_sideflag contents nodrop
ed_sideflag
ed_sideflag contents q3:nodrop
ed_sideflag flags
ed_sideflag
ui_idle 3
ui_sync
ed_dump renamed

// The same numbers as Quake III reads them.
ed_sideflag as q3
ed_sideflag names
ed_sideflag
ui_idle 3
ui_sync
ed_dump third
quit
