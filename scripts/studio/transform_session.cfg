// Turn and size handles: a box drawn in the top view is turned by the knob on
// its ring, stretched by a handle, stretched again about a pivot set by hand,
// inflated, and grouped with a pivot of its own
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene turns
ui_idle 3
ui_sync
ed_layout 4
ed_grid 16
ui_idle 4
ui_sync

// Draw (6): a box twice as long as it is deep.
ui_click 788 300 1
ui_key 6
ui_idle 2
ui_sync
ui_drag 700 150 760 180
ui_idle 4
ui_sync
ui_key 1
ui_idle 2
ui_sync
ed_dump drawn

// G goes from the arrows to the rings. The ring that faces the top view has
// a knob to its right; taken a quarter of the way round, it turns the box.
ui_key g
ui_idle 3
ui_sync
ed_dump rings
screenshot transform_rings
ui_press 760 164
ui_move 757 150
ui_move 745 137
ui_move 729 133
ui_idle 3
ui_sync
screenshot transform_turning
ui_release 729 133
ui_idle 4
ui_sync
ed_dump turned
ed_undo

// A coarser snap: a drag of about forty degrees lands on forty-five.
ed_anglesnap 45
ui_drag 760 164 753 144
ui_idle 4
ui_sync
ed_dump slanted
ed_undo

// G again: boxes that size. The red one, pulled out by its own length,
// doubles the box along x about its middle.
ui_key g
ui_idle 3
ui_sync
ed_dump boxes
ui_drag 760 164 791 164
ui_idle 4
ui_sync
ed_dump doubled
screenshot transform_sized
ed_undo

// With a pivot at the box's near corner the same pull grows it one way only.
ed_pivot -288 112 0
ui_idle 3
ui_sync
ed_dump pivoted
ui_drag 731 179 762 179
ui_idle 4
ui_sync
ed_dump grown
screenshot transform_pivot
ed_undo
ed_pivot clear

// Every side pushed out by a grid step.
ed_inflate up
ui_idle 3
ui_sync
ed_dump inflated
ed_undo

// A group keeps a pivot of its own, which goes where the group goes.
ed_group pillar
ed_pivot 0 0 0
ed_move 16 0 0
ui_idle 3
ui_sync
ed_dump grouped
ed_rotate 90
ui_idle 3
ui_sync
ed_dump swung
ed_texlock off
ed_gizmo move
ui_idle 3
ui_sync
ed_dump left
ed_save
quit
