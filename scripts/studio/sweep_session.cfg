// Sweeps: an outline carried along a line of points and along a path of
// named entities, mitred where the path turns; a brush's own outline
// swept; and a sweep swept again after its path has moved
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene rails
ui_idle 4
ui_sync
ed_layout 4
ui_idle 3
ui_sync

// A square beam along a line with one turn: two brushes, mitred.
ed_sweep square 32 16 line -192 -192 8 64 -192 8 64 64 8
ui_idle 4
ui_sync
ed_dump beam

// Three corners of a path, each naming the next; a rail swept along them.
ed_select
ed_new path_corner
ed_set origin "-192 128 48"
ed_set targetname c1
ed_set target c2
ed_new path_corner
ed_set origin "0 128 48"
ed_set targetname c2
ed_set target c3
ed_new path_corner
ed_set origin "0 224 48"
ed_set targetname c3
ed_select
ed_sweep rail 24 48 along c1
ui_idle 4
ui_sync
ed_dump rail
screenshot sweep_rail

// The path's last corner moved; swept again, the rail follows it.
ed_select brush 5
ed_set origin "128 224 112"
ed_select brush 6
ed_sweep again
ui_idle 4
ui_sync
ed_dump again
ed_select brush 6 5
ed_dump piece
ed_undo
ui_idle 4
ui_sync
ed_select brush 6 5
ed_dump undone

// A brush's own outline, seen from the front, swept round a closed line.
ed_select
ed_mode draw
ui_drag 700 250 730 262
ui_sync
ed_mode brush
ed_sweep brush 32 48 line 96 -224 64 240 -224 64 240 -80 64 96 -80 64 closed
ui_idle 4
ui_sync
ed_dump ring
screenshot sweep_ring
quit
