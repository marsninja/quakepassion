// Programs outside the studio and the mouse: a file opened with the program
// kept for its ending, an image changed by it read again without being
// asked, and how the mouse turns and the wheel moves the camera
// (scripts/validate_studio.jac runs this; it writes the image, a spare to
// "edit" it into, and names its folder in QP_TEXTURES).
edit
ui_idle 3
ui_sync
ed_scene skins
ui_idle 3
ui_sync
ed_cam 0 -420 260 90 -24
ed_box 128 128 96
ui_idle 3
ui_sync

// The project's own image, four texels a side, fitted to the block's +x side.
ed_face 3 0
ed_material file:crate.png
ed_tex fit
ui_idle 4
ui_sync
ed_dump own

// A program kept for files ending .png; the material in hand opened with it.
ed_assoc png "sh scripts/studio/fixtures/fake_editor.sh %file%"
ed_assoc tga "nothing %file%"
ed_assoc tga
ed_dump kept
ed_assoc
ed_openwith
// A second by the clock (frames are not a measure of time), for the
// program to do its work and the studio to notice.
ed_run sleep 1
ui_idle 4
ui_sync
ed_tex fit
ui_idle 4
ui_sync
ed_dump changed
screenshot outside_changed

// The mouse: a right drag turns the 3D camera; twice as fast and upside
// down when told; the wheel twice as far and the other way.
ed_select
ed_cam 0 -420 260 90 0
ui_idle 2
ui_sync
ed_dump level
ui_drag 600 300 700 320 1
ui_sync
ed_dump turned
ed_mouse look 2
ed_mouse invert on
ed_cam 0 -420 260 90 0
ui_idle 2
ui_sync
ui_drag 600 300 700 320 1
ui_sync
ed_dump faster
ed_cam 0 -420 260 90 0
ui_idle 2
ui_sync
ui_wheel 1
ui_sync
ed_dump wheeled
ed_mouse wheel 2
ed_mouse reverse on
ed_cam 0 -420 260 90 0
ui_idle 2
ui_sync
ui_wheel 1
ui_sync
ed_dump reversed
quit
