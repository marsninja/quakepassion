// An entity marked for later: brushes handed to it, the mark picked, a
// light's place changed with its, and the mark cleared. Then a terrain: a
// rectangle lifted by numbers with a falloff that is a share of its side,
// a rectangle drawn on it by a drag in sculpt mode and lifted, another
// lowered with Shift, and the round brush again
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene plots
ui_idle 3
ui_sync
ed_cam 0 -420 260 90 -24
ed_box 64 64 64
ed_cam 160 -420 260 90 -24
ed_box 64 64 32
ed_tie func_wall
ed_marked
ed_marked take

// The wall is marked; the other box is handed to it from the mark.
ed_select class:func_wall
ed_marked set
ed_select solid:3
ed_marked take
ed_dump taken
ed_select
ed_marked pick
ed_dump picked

// A light changes places with the marked wall.
ed_select
ed_cam -160 -420 260 90 -24
ed_new light
ed_dump lightat
ed_marked swap
ed_dump swapped
ed_marked clear
ed_marked take
ed_dump cleared

// A terrain, and a rectangle of it lifted by numbers: the falloff is half
// of the rectangle's shorter side.
ed_select class:func_wall
ed_delete
ed_select class:light
ed_delete
ed_cam 0 -520 420 90 -40
ed_terrain 8 8 64
ui_idle 4
ui_sync
ed_terrain lift -64 -64 64 64 32 50%
ui_idle 4
ui_sync
ed_dump numbers

// Sculpt mode with the rectangle brush: a drag draws a rectangle on the
// terrain and lifts it; with Shift another is lowered.
ed_mode sculpt
ed_brush 64 24
ed_brush rect on 25%
ui_press 500 330
ui_move 600 380
ui_move 720 430
ui_idle 3
ui_sync
ed_dump drawing
screenshot rectlift_drawing
ui_release 720 430
ui_idle 4
ui_sync
ed_dump dragged
screenshot rectlift_lifted
ui_mod shift 1
ui_drag 520 300 600 340
ui_mod shift 0
ui_idle 4
ui_sync
ed_dump lowered

// The round brush again: a drag is a stroke, not a rectangle.
ed_brush rect off
ui_drag 560 400 660 400
ui_idle 4
ui_sync
ed_dump round
ed_mode brush
quit
