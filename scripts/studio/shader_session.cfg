// A Quake III shader script: a shader made, its lines and stages changed, a
// mistake made and found by the check, mended, saved, and opened again; and
// a broken script's faults listed by line
// (scripts/validate_studio.jac runs this, and names the folder in QP_SHADERS).
edit
ui_idle 3
ui_sync
ed_shader open keep
ed_shader new textures/keep/water
ed_dump made
ed_shader show

// Its own lines, and a stage's; a third stage added and moved to the front.
ed_shader set surfaceparm trans
ed_shader set surfaceparm water
ed_shader set cull none
ed_shader stage 1 set tcMod scroll 0.1 0.05
ed_shader stage 1 set tcMod turb 0 0.2 0 0.1
ed_shader stage 1 set tcMod scroll 0.2 0
ed_shader stage add textures/keep/foam.tga
ed_shader stage 2 set blendFunc add
ed_shader stage 2 move 0
ed_dump shaped
ed_shader show
ed_shader check

// A mistake: the check says what and where; mended, it says nothing.
ed_shader stage 0 set rgbGen rainbow
ed_shader set glitter 5
ed_dump wrong
ed_shader check
ui_idle 2
ui_sync
ui_click 148 67
ui_idle 3
ui_sync
screenshot shader_faults
ed_shader stage 0 set rgbGen identity
ed_shader unset glitter
ed_dump mended
ed_shader check
ed_shader save

// A second shader; the script saved and opened again.
ed_shader new textures/keep/glow
ed_shader save
ed_shader open keep
ed_dump reopened
ed_shader
ed_shader pick textures/keep/water
ed_dump picked

// A script someone broke by hand.
ed_shader open broken
ed_dump broken
ed_shader check
quit
