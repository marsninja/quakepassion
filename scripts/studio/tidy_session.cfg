// Small tools on a scene: snapping, a material replaced, brushes lined up,
// face picks spread, a brush glued against a tagged face, and the counts
// (scripts/validate_studio.jac).
edit
ui_idle 3
ui_sync
ed_scene tidy
ui_idle 3
ui_sync
ed_cam 0 -420 260 90 -24
ed_box 64 64 64
ed_move 3 -2 1
ui_idle 3
ui_sync
ed_dump askew

// Back onto the grid.
ed_snap
ui_idle 3
ui_sync
ed_dump snapped

// A material given, then replaced everywhere it is.
ed_material brick
ed_replace brick stone all
ui_idle 3
ui_sync
ed_dump replaced

// A smaller box hanging in the air beside it, lined up by their undersides.
ed_cam 200 -420 260 90 -24
ed_box 32 32 32
ed_move 0 0 24
ed_select solid:3 add
ed_align z low
ui_idle 3
ui_sync
ed_dump aligned

// Tag the first box's +x face and glue the small one against it.
ed_face 3 0
ed_tag
ed_select solid:4
ed_glue
ui_idle 3
ui_sync
ed_dump glued

// A face pick spread: the brush's other faces, then all of them.
ed_face 3 4
ed_faces invert
ui_idle 3
ui_sync
ed_dump others
ed_faces all
ui_idle 3
ui_sync
ed_dump every
screenshot tidy_faces
ed_stats

// Tab steps to the next entity; frozen, a click in the level leaves it selected.
ed_select
ui_click 700 600 1
ui_key TAB
ui_idle 3
ui_sync
ed_dump stepped
ed_freeze on
ui_click 620 373
ui_idle 3
ui_sync
ed_dump frozen
ed_freeze off
ui_click 620 373
ui_idle 3
ui_sync
ed_dump thawed

// A material no archive holds is found by the check, and the materials in use are written out.
ed_select solid:4
ed_material q2:e1u1/no_such_texture
ed_check
ed_stats .jac/studio-pack/materials.txt
quit
