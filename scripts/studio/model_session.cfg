// The model editor: a model made from a primitive, its triangles picked
// and pushed out, a frame copied and its points moved, triangles cut and
// turned round and the turn undone, a second part added, the model checked,
// saved as MD3 and OBJ, closed and opened again from the MD3
// (scripts/validate_studio.jac runs this, and names the folder in QP_MODELS).
edit
ui_idle 3
ui_sync
ed_model new cylinder 64 64 96 8
ui_idle 6
ui_sync
ed_dump made
screenshot model_new

// The top's eight triangles pushed out thirty-two units on walls.
ed_pick faces 16 17 18 19 20 21 22 23
ed_dump picked
ed_mesh extrude 32
ui_idle 3
ui_sync
ed_dump extruded
ed_pick none

// A second frame, the whole model sixteen higher in it; the first as it was.
ed_model frame copy raised
ed_mesh move 0 0 16
ui_idle 3
ui_sync
ed_dump second
ed_frame 0
ed_dump first

// Every triangle cut in four; turned round, and that undone.
ed_mesh subdivide 4
ed_dump cut
ed_mesh flip
ed_dump inside_out
ed_model undo
ed_dump righted

// A ball added as a second part; the model checked and saved both ways.
ed_model add sphere 32 32 32 8
ed_model part
ed_dump two
ed_model check

// The panel's own buttons: every triangle of the ball cut in four, and that undone.
ui_idle 4
ui_sync
ui_click 794 671
ui_sync
ed_dump clicked
ui_click 642 643
ui_sync
ed_dump unclicked
ed_model save tower.md3
ed_model save tower.obj
ed_model box on
ed_model axes on
ui_idle 4
ui_sync
screenshot model_marks

// Closed, and opened again from the file: both parts, both frames.
ed_model close
ed_dump closed
ed_model open tower.md3
ui_idle 4
ui_sync
ed_frame 1
ed_dump reopened
quit
