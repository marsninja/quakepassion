// Clicks that go through what is in front, steps to the selection's kin,
// brushes by number, kept sets, a swap and a tour of the selection
// (scripts/validate_studio.jac runs this, then opens the saved map again).
edit
ui_idle 3
ui_sync
ed_scene picks
ui_idle 3
ui_sync
ed_layout 4
ed_grid 16
ui_idle 4
ui_sync

// Two boxes over the same ground: one drawn and lifted, one drawn under it
// (a box is drawn at the height of what is selected, so nothing is).
ui_click 788 300 1
ui_key 6
ui_idle 2
ui_sync
ui_drag 700 150 760 180
ui_idle 4
ui_sync
ed_move 0 0 96
ed_select
ui_idle 2
ui_sync
ui_drag 700 150 760 180
ui_idle 4
ui_sync
ui_key 1
ed_select
ui_idle 3
ui_sync

// A click in the top view picks the upper box; clicked again in the same
// place it goes to the one under it, then to the floor, then round again.
ui_click 730 165
ui_idle 3
ui_sync
ed_dump first
ui_click 730 165
ui_idle 3
ui_sync
ed_dump second
ui_click 730 165
ui_idle 3
ui_sync
ed_dump third
ui_click 730 165
ui_idle 3
ui_sync
ed_dump round
ed_keep upper
screenshot select_through

// By number, as a compiler names them: entity 0's third brush.
ed_select brush 0 2
ui_idle 2
ui_sync
ed_dump numbered

// To the entity that owns it, and from that to all its brushes.
ed_select parent
ui_idle 2
ui_sync
ed_dump owner
ed_select child
ui_idle 2
ui_sync
ed_dump children
ed_keep walls

// A kept set picked again, alone and then added to.
ed_select
ed_recall upper
ui_idle 2
ui_sync
ed_dump picked

// The upper box and the player start change places.
ed_select 2
ed_recall upper add
ui_idle 2
ui_sync
ed_dump pair
ed_swap
ui_idle 3
ui_sync
ed_dump swapped
screenshot select_swapped

// N looks at each selected thing in turn.
ui_click 788 300 1
ui_key n
ui_idle 3
ui_sync
ed_dump toured
ui_key n
ui_idle 3
ui_sync
ed_dump onward
ed_save
quit
