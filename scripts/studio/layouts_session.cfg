// The views' room shared out by numbers and by dragging the bars between
// them, the side panels changing sides, and layouts kept by name and
// brought back; all of it kept between sessions
// (scripts/validate_studio.jac runs this twice over one settings folder).
edit
ui_idle 4
ui_sync
ed_dump opened
ed_layout drop work
ed_sides left
ed_log panel off
ed_split even
ed_scene rooms
ui_idle 3
ui_sync
ed_cam 0 -420 260 90 -24
ed_box 64 64 64
ed_select
ed_layout 4
ui_idle 4
ui_sync
ed_dump four

// By numbers: the left views wider, the upper ones shorter.
ed_split x 65
ed_split y 35
ui_idle 4
ui_sync
ed_dump split
screenshot layouts_split

// By the pointer: the bar between the left and right views dragged
// leftward, the bar between the rows dragged down to the middle.
ui_drag 719 200 500 200
ui_idle 4
ui_sync
ed_dump narrowed
ui_drag 500 277 500 373
ui_idle 4
ui_sync
ed_dump levelled

// The scene list and the inspector change sides.
ed_sides swap
ui_idle 4
ui_sync
ed_dump swapped
ed_log panel on 4
ui_idle 4
ui_sync
screenshot layouts_swapped
ed_layout save work

// A plain layout kept too; then the first brought back whole.
ed_layout 1
ed_split even
ed_sides left
ed_log panel off
ui_idle 4
ui_sync
ed_dump plain
ed_layout save plain
ed_layout list
ed_layout load work
ui_idle 4
ui_sync
ed_dump loaded
screenshot layouts_loaded
ed_layout drop plain
ed_layout load plain
ed_layout list
ed_dump dropped
quit
