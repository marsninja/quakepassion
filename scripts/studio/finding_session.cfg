// Finding things: the explorer's files by kind and by game, tags hung on
// files and searched by, what there is to know of a texture, and the
// materials of one size (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_layout assets
ui_idle 4
ui_sync

// Quake II's pictures named for metal; every sound named for a menu;
// Quake's models named for a soldier.
ed_assetfind metal kind:image game:q2
ui_idle 4
ui_sync
ed_dump pictures
ed_assetfind menu kind:sound
ui_idle 4
ui_sync
ed_dump sounds
ed_assetfind soldier kind:models game:quake
ui_idle 4
ui_sync
ed_dump models
ed_assetfind metal kind:nonsense
ui_idle 4
ui_sync
ed_dump nothing

// Two files given a tag of the same word, one of them another as well
// and that one taken off; a tag of more than a word refused.
ed_assetfind
ed_asset file:q1:progs/soldier.mdl
ed_assettag grunt
ed_assettag a:b
ed_asset file:q2:textures/e1u1/metal1_1.wal
ed_assettag trim
ed_assettag grunt
ed_assettag drop trim
ed_assettag list
ed_assetfind tag:grunt
ui_idle 4
ui_sync
ed_dump tagged
ed_assetfind tag:grunt kind:model
ui_idle 4
ui_sync
ed_dump tagged_models
ed_assetfind tag:trim
ui_idle 4
ui_sync
ed_dump untagged
ed_assetfind

// What there is to know of a texture of each game.
ed_texinfo q2:e1u1/metal1_1
ed_texinfo q1:e1m1/+0slip
ed_texinfo q1:e1m1/tech04_1
ed_texinfo q3:textures/base_wall/archpipe2_k_tall3fin
ed_dump known

// The level again, and its textures of one size, and of a size or more.
ed_layout four
ui_idle 3
ui_sync
ui_click 84 67
ed_shelf q1:e1m1
ui_idle 6
ui_sync
ed_matfilter size:64x64
ui_idle 6
ui_sync
ed_dump square
ed_matfilter tech size:>=128
ui_idle 6
ui_sync
ed_dump large
ed_matfilter
ui_idle 4
ui_sync
ed_dump all
quit
