// The ways bots take between the spots they camp at and roam through:
// nothing to ask before the navigation is baked; then each spot to the
// next, with a jump onto a low box and no way up a tall one; from the one
// thing picked to every spot; walked again when a spot moves; and put away
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene camps
ui_idle 3
ui_sync

// A floor, a box too tall to climb and a box low enough to jump onto.
ed_cam 0 -420 260 90 -24
ed_box 64 64 64
ed_cam 160 -420 260 90 -24
ed_box 64 64 32
ui_idle 4
ui_sync

// Two spots on the floor, one on the low box and one on the tall.
ed_new info_camp
ed_set origin "-200 -200 24"
ed_set range 96
ed_new item_botroam
ed_set origin "200 -200 24"
ed_new info_camp
ed_set origin "160 160 56"
ed_new info_camp
ed_set origin "0 160 88"
ed_dump placed
ed_select
ed_camps

// Nothing is baked: there is no navigation to ask the way of.
ed_camps routes on
ed_dump unbaked

// Baked: each spot to the next.
ed_nav bake
ed_camps routes on
ed_cam 0 -380 420 90 -48
ui_idle 4
ui_sync
ed_dump chained
screenshot camproute_chained

// From the player's start to every spot.
ed_select class:info_player_start
ui_idle 4
ui_sync
ed_dump fromstart
ed_camps routes on
ui_idle 2
ui_sync
screenshot camproute_fromstart

// The roaming spot moved: its ways are walked again without being asked.
ed_select class:item_botroam
ed_set origin "-200 100 24"
ui_idle 4
ui_sync
ed_dump moved
ed_camps routes on

// From the spot on the tall box there is a way down to each of the others.
ed_select 8
ui_idle 4
ui_sync
ed_dump fromtall
ed_camps routes on

// Nothing picked: the chain again, by the spot's new place. Then put away.
ed_select
ui_idle 4
ui_sync
ed_dump rechained
ed_camps routes off
ui_idle 2
ui_sync
ed_dump off
quit
