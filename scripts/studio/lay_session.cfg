// A curved patch told where its control points lie on its material: spread
// over it in repeats, slid by rows, columns and single points, kept through
// a bend, taken from a tagged face, let go when its grid changes, and
// forgotten (scripts/validate_studio.jac). The window is the default 1280 by 720.
edit
ui_idle 3
ui_sync
ed_scene lay
ui_idle 3
ui_sync
ed_material tile

// A box to take a material's lie from later, and a flat sheet beside it.
ed_cam -200 -420 260 90 -24
ed_box 64 64 64
ui_idle 3
ui_sync
ed_dump boxed
ed_cam 0 -420 260 90 -24
ed_patch sheet 128 128 64
ui_idle 4
ui_sync
ed_patch uv
ed_dump made

// The material spread once over the whole sheet.
ed_patch uv fit
ui_idle 3
ui_sync
ed_dump fitted

// Twice across and once up; then all of it slid, its last row, its first
// column, and one corner alone.
ed_patch uv fit 2 1
ed_dump twice
ed_patch uv all 16 8
ed_dump slid
ed_patch uv row 2 0 32
ed_dump row
ed_patch uv col 0 -4 0
ed_dump column
ed_patch uv point 0 0 -16 -8
ui_idle 3
ui_sync
ed_dump point

// Its middle lifted: the places stay with the control points.
ed_patch_point 4 4 0 0 32
ui_idle 4
ui_sync
ed_patch uv
ed_dump bent
screenshot lay_bent
ed_save

// The box's top, its material slid, tagged: the patch takes the material
// as it lies there.
ed_face 3 4
ed_tex shift 8 4
ed_tag
ui_idle 3
ui_sync
ed_dump tagged
ed_select 4
ed_patch uv project
ui_idle 3
ui_sync
ed_dump projected

// One more curve across: nine places do not fit fifteen points. Undone, they are back.
ed_patch grow u
ui_idle 3
ui_sync
ed_patch uv
ed_dump grown
ed_undo
ui_idle 3
ui_sync
ed_patch uv
ed_dump shrunk

// Forgotten, and nothing to slide after that.
ed_patch uv clear
ui_idle 3
ui_sync
ed_dump cleared
ed_patch uv row 1 4 4
ed_patch uv clear
ed_dump refused
ed_undo
ui_idle 3
ui_sync
ed_patch uv
ed_dump back
quit
