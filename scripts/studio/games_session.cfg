// Entities that carry the game whose rules they are spawned by, in a scene
// of no one game; an entity found carrying none, and given its class's;
// camp spots for bots; and the level played with its pickups spawned
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene mixed
ui_idle 3
ui_sync
ed_grid 16

// A pickup and a monster of Quake's: each carries its game as it is added.
ed_cam 0 -200 80 90 -20
ed_new item_health
ed_dump health
ed_cam 96 -200 80 90 -20
ed_new monster_ogre
ed_dump ogre

// Another pickup, given another game by hand; then left with none, found
// by the check, and given its class's.
ed_cam -96 -200 80 90 -20
ed_new item_armor2
ed_assetgame none
ed_dump stray
ed_check
ed_assetgame fill
ed_dump filled
ed_check

// Where bots camp and roam.
ed_cam 0 -100 80 90 -20
ed_new info_camp
ed_set range 96
ed_set weight 2
ed_cam 160 -100 80 90 -20
ed_new item_botroam
ed_select
ed_dump spots
ed_camps
ed_cam 0 -420 260 90 -24
ui_idle 4
ui_sync
screenshot games_camps

// Played: what was placed is spawned by its own game's rules.
ed_cam 0 -300 80 90 0
ed_play here
ed_pause on
wait
wait
wait
ed_played playing
ed_live
ed_stop
ui_idle 4
ui_sync
quit
