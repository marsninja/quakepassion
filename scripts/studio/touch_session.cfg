// Fine work on a terrain: the corners of a terrace moved together, a plot
// of adjoining cells picked, outlined, lifted and painted, a plot picked
// by Alt and a press, and the terrain's top and bottom moved apart
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene fine
ui_idle 3
ui_sync
ed_cam 0 -520 420 90 -40
ed_terrain 4 4 64
ui_idle 4
ui_sync
ed_dump made

// The eastern corners lifted into a terrace; then the terrace touched: its
// corners go up together, and the low ground stays.
ed_terrain lift 0 -4096 4096 4096 32
ui_idle 4
ui_sync
ed_dump terrace
ed_touch 100 0 8
ui_idle 4
ui_sync
ed_dump touched

// The cells of the low ground picked as a plot, outlined, lifted and painted.
ed_plot -100 0
ui_idle 4
ui_sync
ed_dump plot
screenshot touch_plot
ed_plot lift 16
ui_idle 4
ui_sync
ed_dump plotlift
ed_material slate
ed_plot paint
ed_plot clear
ed_dump cleared

// In sculpt mode Alt and a press picks the plot under the pointer.
ed_mode sculpt
ui_mod alt 1
ui_click 620 420
ui_mod alt 0
ui_sync
ed_dump pressed
ed_plot clear
ed_mode brush

// The top up, the underside down, and the whole of it up.
ed_terrain top 8
ui_idle 4
ui_sync
ed_dump top
ed_terrain bottom -16
ui_idle 4
ui_sync
ed_dump bottom
ed_select brush 2 0
ed_dump under
ed_select brush 2
ed_terrain both 32
ui_idle 4
ui_sync
ed_select brush 2 0
ed_dump both
quit
