// A box drawn by a drag in the top view, cut along a line drawn across it,
// and the studio's settings kept (scripts/validate_studio.jac runs this,
// then opens the studio again to see the settings come back).
edit
ui_idle 3
ui_sync
ed_scene plan
ui_idle 3
ui_sync
ed_layout 4
ed_grid 16
ui_idle 4
ui_sync
ed_dump four

// Draw (6): a rectangle dragged in the top view becomes a box on the floor.
ui_click 788 300 1
ui_key 6
ui_idle 2
ui_sync
ui_drag 700 150 760 210
ui_idle 4
ui_sync
ed_dump drawn
screenshot draw_box

// Clip (5): a line drawn down through the box cuts it in two.
ui_key 5
ui_idle 2
ui_sync
ui_drag 730 130 730 230
ui_idle 4
ui_sync
ed_dump cut

// With Shift, only what is behind the line is kept.
ui_mod shift 1
ui_drag 690 180 770 180
ui_mod shift 0
ui_idle 4
ui_sync
ed_dump trimmed
screenshot draw_cut
ui_key 1
ed_display wire axis
ed_save
quit
