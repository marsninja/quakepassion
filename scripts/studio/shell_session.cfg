// The studio's shell, driven as a hand would drive it (scripts/validate_studio.jac).
// Laid out for the default 1280 by 720 window: the menu bar is 24 tall and the
// toolbar 32, so the panels start at y 56; the scene list is 280 wide and its
// rows start at y 110, 20 apart; the inspector is the last 320.
edit
ui_idle 3
ui_sync
ed_dump
screenshot studio_open

// Filter the scene list, then pick the player start from it.
ui_click 140 95
ui_type player_start
ui_sync
ui_click 140 140
ui_sync
ed_dump picked-from-list
screenshot studio_listed

// A double click on the row looks at it.
ui_double 140 140
ui_sync
screenshot studio_looked

// Set its angle in the inspector (the class is the first row, then the
// map's order: origin, angle): select the field's text, type, Enter.
ui_click 1150 175
ui_mod ctrl 1
ui_key a
ui_mod ctrl 0
ui_type 180
ui_key ENTER
ui_sync
ed_dump angle-set

// An origin that is not three numbers is refused: type one into its field.
ui_click 1150 149
ui_mod ctrl 1
ui_key a
ui_mod ctrl 0
ui_type nowhere
ui_key ENTER
ui_sync
ed_dump refused

// Undo and redo from the keyboard. (The right click gives the level view
// the keys; it is off the selected entity, where it would open that
// entity's menu.)
ui_click 330 100 1
ui_mod ctrl 1
ui_key z
ui_mod ctrl 0
ui_sync
ed_dump undone
ui_mod ctrl 1
ui_key y
ui_mod ctrl 0
ui_sync
ed_dump redone

// Pick in the level: the camera looks at the player start, so the middle of
// the view is on it. Select nothing first.
ui_key ESCAPE
ui_sync
ed_dump cleared
ui_click 620 372
ui_sync
ed_dump picked-in-level
screenshot studio_picked

// Drag it sideways with the left button.
ui_drag 620 372 720 372
ui_sync
ed_dump dragged

// Fly: a right drag turns the camera and the wheel moves it.
ui_drag 620 372 720 372 1
ui_wheel 2
ui_sync
ed_dump flown

// Add an entity from the toolbar, nudge it, duplicate it, delete the copy.
ui_click 400 40
ui_type light
ui_key ENTER
ui_sync
ed_dump added
ui_click 700 400 1
ui_key UPARROW
ui_sync
ed_dump nudged
ui_mod ctrl 1
ui_key d
ui_mod ctrl 0
ui_sync
ed_dump duplicated
ui_key DEL
ui_sync
ed_dump deleted
screenshot studio_edited

// Save from the File menu: open it, click its first item.
ui_click 22 12
ui_sync
screenshot studio_menu
ui_click 60 40
ui_sync
ed_dump saved

// Play, let it run, and come back.
ed_play
wait
wait
wait
wait
wait
wait
screenshot studio_playing
edit
ui_idle 3
ui_sync
ed_dump returned
screenshot studio_returned
quit
