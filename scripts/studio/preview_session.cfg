// Entities as the game would show them: the models of a shipped level's
// monsters and pickups listed, and drawn in the 3D view where they stand
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_dump boxes
ed_models list
ed_models on
ui_idle 6
ui_sync
ed_dump models
screenshot preview_models
ed_models off
ui_idle 3
ui_sync
ed_dump off
quit
