// The grid, remembered views, hiding, dropping, the history list and the
// autosave, driven as a hand would drive them (scripts/validate_studio.jac).
edit
ui_idle 3
ui_sync
ed_scene handy
ui_idle 3
ui_sync
ed_cam 0 -420 260 90 -24
ed_box 64 64 64
ui_idle 3
ui_sync
ed_dump boxed

// The grid by a command and by its keys.
ed_grid 32
ui_click 700 600 1
ui_key ]
ui_idle 2
ui_sync
ed_dump coarse
ui_key [
ui_key [
ui_idle 2
ui_sync
ed_dump fine

// Lifted, then dropped back onto the floor (End).
ed_move 0 0 40
ui_idle 4
ui_sync
ed_dump lifted
ui_key END
ui_idle 4
ui_sync
ed_dump dropped

// A view remembered in the document, left, and gone back to.
ed_mark overview
ed_cam 100 100 100 0 0
ed_goto overview
ui_idle 2
ui_sync
ed_dump returned

// H hides the selected brush while editing; Shift+H shows everything.
ui_key h
ui_idle 4
ui_sync
ed_dump hid
ui_mod shift 1
ui_key h
ui_mod shift 0
ui_idle 4
ui_sync
ed_dump shown
ed_select solid:3
ed_hide others
ui_idle 4
ui_sync
ed_dump alone
ed_show
ui_idle 4
ui_sync

// The history list: choose the second line, which undoes two edits.
ed_dump before
ed_history
ui_idle 3
ui_sync
screenshot handy_history
ui_click 360 117
ui_idle 4
ui_sync
ed_dump undone

// The palette (Ctrl+P): a command typed with its words runs as typed...
ui_click 700 600 1
ui_mod ctrl 1
ui_key p
ui_mod ctrl 0
ui_idle 3
ui_sync
ui_type ed_grid 4
ui_idle 3
ui_sync
screenshot handy_palette
ui_key ENTER
ui_idle 3
ui_sync
ed_dump typed

// ...and a few letters find one: "leak" lights ed_leak, and Enter runs it.
ui_mod ctrl 1
ui_key p
ui_mod ctrl 0
ui_idle 3
ui_sync
ui_type leak
ui_key ENTER
ui_idle 4
ui_sync
ed_dump found

// A light shows how far it reaches, and the way it would face.
ed_new light
ed_set angle 45
ui_idle 3
ui_sync
screenshot handy_light

// An autosave, a selection by field, and a look at everything.
ed_autosave
ed_select field:classname=info_player_start
ed_focus all
ui_idle 3
ui_sync
ed_dump picked
quit
