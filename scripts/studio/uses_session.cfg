// What a scene uses and what uses a thing: materials and models listed with
// what no archive holds marked; everything that uses one material, one
// model, and nothing at all. Then a project: its own files in the explorer
// beside the games', a file dragged out of Quake's archives onto it, and a
// folder (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene deps
ui_idle 3
ui_sync
ed_cam 0 -420 260 90 -24
ed_material q1:e1m1/tech04_1
ed_box 64 64 64
ed_select
ed_material q1:nothere/thing
ed_cam 160 -420 260 90 -24
ed_box 64 64 32
ed_new misc_model
ed_set model models/mapobjects/nothere/lamp.md3
ed_new misc_model
ed_set model models/powerups/holdable/teleporter.md3
ed_new misc_model
ed_set model models/powerups/holdable/teleporter.md3
ed_select
ed_uses
ed_dump listed
ui_click 142 67
ui_idle 4
ui_sync
screenshot uses_listed

// What uses one material, one model, and something nothing uses.
ed_uses q1:e1m1/tech04_1
ed_dump material
ed_uses models/powerups/holdable/teleporter.md3
ed_dump model
ed_uses nothing/at/all
ed_dump nothing

// A project's own files are in the explorer; a file and a folder of
// Quake's are dragged onto it and are copied into it.
ed_layout assets
ui_idle 4
ui_sync
ed_asset dir:q1:
ui_idle 4
ui_sync
ui_drag 350 215 350 395
ui_idle 4
ui_sync
ed_dump noproject
ed_project new keep "The keep"
ui_idle 4
ui_sync
ui_drag 350 215 350 435
ui_idle 4
ui_sync
ed_dump file
ui_drag 350 115 350 435
ui_idle 6
ui_sync
ed_dump folder
ed_asset dir:own:
ed_asset dir:own:files
ed_asset dir:own:files/q1
ed_asset file:own:files/q1/default.cfg
ui_idle 4
ui_sync
ed_dump shown
screenshot uses_project
quit
