// An entity's facing swung by the tip of its arrow and a light's reach
// pulled by its handle; a path drawn corner to corner; pieces of logic
// added from the library; a favourite class kept and used
// (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene marks
ui_idle 3
ui_sync
ed_layout 4
ed_grid 16
ui_idle 4
ui_sync

// The player start faces +y (90). In the plan its arrow's tip is 48 units
// up from it; dragged round to the right of it, it faces +x.
ed_select 2
ui_idle 3
ui_sync
ed_dump start
ui_drag 788 198 803 213
ui_idle 4
ui_sync
ed_dump faced
screenshot marks_faced

// A light of 100 at a known place; its reach handle is to the right of it,
// twice the light's value away. Pulled out to 400 units, the light is 200.
ed_new light
ed_set origin "0 128 64"
ed_set light 100
ui_idle 4
ui_sync
ed_dump lamp
ui_drag 849 174 911 174
ui_idle 4
ui_sync
ed_dump brighter
screenshot marks_light

// A click on a handle that is not dragged changes nothing.
ui_click 911 174
ui_idle 3
ui_sync
ed_dump clicked

// Two path corners, one sending on to the other.
ed_new path_corner
ed_set targetname c1
ed_set target c2
ed_set origin "-128 -128 16"
ed_new path_corner
ed_set targetname c2
ed_set origin "128 -128 16"
ed_select
ui_idle 4
ui_sync
screenshot marks_path

// Logic from the library: what this game has, and a counter added.
ed_logic nothing
ed_logic counter
ui_idle 4
ui_sync
ed_dump counter

// A favourite kept, found in the Library tab's list, and used.
ed_fav item_health
ed_library fav:item_health
ui_idle 4
ui_sync
ed_dump favourite
ed_save
quit
