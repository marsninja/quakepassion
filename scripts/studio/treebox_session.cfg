// A box drawn by a drag in the 3D view, on the floor it stands on; and the
// scene tree said in words, with a group that is a duplicator marked as
// one (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene yard
ui_idle 3
ui_sync
ed_grid 16
ed_cam 0 -420 260 90 -24
ui_idle 3
ui_sync
ed_dump bare

// Draw mode, and a drag across the floor in the 3D view: a box sixty-four
// high on the grid where the drag came down.
ui_key 6
ui_idle 2
ui_sync
ui_drag 560 420 700 500
ui_idle 5
ui_sync
ed_dump drawn
// The same rectangle by command is the same box again; a drag that ends
// in the sky is none.
ed_select
ed_box_draw 0 560 420 700 500
ui_idle 4
ui_sync
ed_dump again
ed_select
ed_box_draw 0 560 420 700 80
ui_idle 4
ui_sync
ed_dump sky

// A box grouped and asked for three copies and a mirror image: the tree
// says the group is a duplicator, and by what.
ui_key 1
ed_select
ed_box 32 32 32
ed_group posts
ed_set _copies 3
ed_set _offset "64 0 0"
ed_set _mirror y
ui_idle 5
ui_sync
ed_dump grouped
ed_tree
ed_tree posts
ed_tree nothing_called_this
quit
