// A material carried from a tagged face round the corner onto the next,
// laid on another just as it lies on the tagged one, fitted in whole
// repeats, painted across faces by a drag, and a face put in the tagged
// plane (scripts/validate_studio.jac runs this).
edit
ui_idle 3
ui_sync
ed_scene wrap
ui_idle 3
ui_sync
ed_layout 4
ed_grid 16
ui_idle 4
ui_sync

// A box drawn in the plan; its top picked, given a material, slid, and tagged.
ui_click 788 300 1
ui_key 6
ui_idle 2
ui_sync
ui_drag 700 150 760 180
ui_idle 4
ui_sync
ui_key 2
ui_idle 2
ui_sync
ui_click 729 164
ui_idle 3
ui_sync
ed_material tile
ed_tex shift 8 4
ed_tag
ui_idle 3
ui_sync
ed_dump tagged

// A face of the box beside the top (the one before it; the one after is the
// bottom, which shares no edge with it) takes the tagged one's material
// round the edge.
ed_faces prev
ed_tex wrap
ui_idle 3
ui_sync
ed_dump wrapped

// The one before that takes it just as it lies on the tagged face.
ed_faces prev
ed_tex project
ui_idle 3
ui_sync
ed_dump projected

// Fitted in whole repeats, a texel stays near a unit.
ed_tex minfit
ui_idle 3
ui_sync
ed_dump fitted

// Alt and a drag in the plan paints the material in hand across the faces
// it passes over: the box's top, then the floor.
ed_select
ed_material moss
ui_mod alt 1
ui_drag 729 164 788 300 0 12
ui_mod alt 0
ui_idle 4
ui_sync
ed_dump painted
screenshot wrap_painted

// The floor's top put in the plane of the tagged face: the floor rises to it.
ui_click 788 250
ui_idle 3
ui_sync
ed_glue face
ui_idle 4
ui_sync
ui_key 1
ed_select brush 0 0
ui_idle 3
ui_sync
ed_dump glued
ed_tag clear
ed_save
quit
